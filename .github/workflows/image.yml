name: Release Docker Image

on:
  release:
    types: [published]  # 当有新的 Release 发布时触发（需由 PAT 创建的 Release 才会触发，GITHUB_TOKEN 创建的不触发）
  workflow_dispatch:
    inputs:
      version:
        description: "中文包版本号（release/x.y.z 的数字部分，如 2.39.6；支持发布序号后缀如 2.39.7-v3→镜像 tag 2.39.7）；留空=自动取最新 Release"
        type: string
        default: ""

permissions:
  contents: read

# 🔴 启用本 workflow 前需在 repo secrets 配置 BCP_REGISTRY_USERNAME / BCP_REGISTRY_PASSWORD
#    （华为云 SWR 登录凭证：username=cn-north-4@AK，password=登录指令中 -p 的密钥，
#    真值见凭证库 swr.hwc_bj4；2026-09-19 自 TX-43 自建库 registry.bcpcloud.cn 迁移，
#    旧库存量 tag 不再更新；SWR 侧重置登录指令后须同步更新 secrets）
#
# v3（2026-09-19）设计变更：
# 1. 构建源从「checkout release tag」改为「下载 Release 资产 editor-ui*.tar.gz」——
#    2.39.7-v3 及更早的 tag 里没有 editor-ui-dist（dist 提交是 2.39.8 链才引入），
#    且旧 tag 的 Dockerfile 还是 DockerHub 基础镜像（runner 拉取限流卡死 35min+ 实锤）。
#    资产构建保证：dist 恒为该版发布物、Dockerfile/基础镜像恒为 main 最新。
# 2. buildx 加 --provenance=false --sbom=false——SWR 解析不了 buildx 默认生成的
#    provenance/attestation 附件 manifest（"Invalid image, fail to parse 'manifest.json'"
#    实锤，layer 推送正常、manifest 被拒）。

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: test
    steps:
      # 🔒 安全修复（2026-09-18 评审 #2/#3）：inputs/tag_name 不再直接内插 shell，
      #    经 env 传入并强制 semver 白名单校验后才使用
      - name: Extract version
        id: extract_version
        env:
          EVT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="$EVT_TAG"
          else
            V="$INPUT_VERSION"
            if [ -z "$V" ]; then
              V=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                https://api.github.com/repos/${{ github.repository }}/releases/latest \
                | jq -r '.tag_name' | sed 's#^release/##')
            fi
            TAG="release/$V"
          fi
          VERSION="${TAG#release/}"
          VERSION="${VERSION#v}"
          # 允许发布序号后缀（2.39.7-v3），镜像 tag 取基础版本号（2.39.7）
          if ! [[ "$VERSION" =~ ^([0-9]+[.][0-9]+[.][0-9]+)(-v[0-9]+)?$ ]]; then
            echo "::error::版本号未通过 semver 白名单校验: '$VERSION'"
            exit 1
          fi
          IMAGE_TAG="${BASH_REMATCH[1]}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION (from $TAG) → image tag: $IMAGE_TAG"

      # v3：从 Release 资产取 dist（tag 里未必有 editor-ui-dist，资产恒有）
      - name: Download and unpack editor-ui dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.extract_version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "editor-ui*.tar.gz" \
            --output /tmp/editor-ui.tar.gz
          mkdir editor-ui-dist
          # 资产结构为 dist/ 顶层（tar -C 构建目录打包），剥掉一层得到 index.html/assets 布局
          tar -xzf /tmp/editor-ui.tar.gz -C editor-ui-dist --strip-components=1
          test -f editor-ui-dist/index.html || { echo "::error::dist 解包后无 index.html，资产结构异常"; exit 1; }
          echo "dist files: $(find editor-ui-dist -type f | wc -l)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Huawei Cloud SWR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: swr.cn-north-4.myhuaweicloud.com
          username: ${{ secrets.BCP_REGISTRY_USERNAME }}
          password: ${{ secrets.BCP_REGISTRY_PASSWORD }}

      - name: Build and push multi-arch Docker images
        run: |
          # 构建并直接推送 multi-arch 镜像（amd64 + arm64）到华为云 SWR
          # --provenance=false --sbom=false：SWR 不认 attestation 附件 manifest（见头注释）
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --build-arg VERSION=$IMAGE_TAG \
            -t swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-chinese:$IMAGE_TAG \
            --push \
            .

      # 部署成功通知（2026-09-18）：镜像推送完成 → 研发部群卡片（交付物就绪提醒）
      - name: Notify Feishu on success
        if: success()
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPO: ${{ github.repository }}
          REL_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.extract_version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg t "[$REPO] 🟢 中文镜像已发布（$IMAGE_TAG）" --arg c "green" \
            --arg m "版本：\`$IMAGE_TAG\`
          镜像：\`swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-chinese:$IMAGE_TAG\`（amd64 + arm64）
          客户实例升级：.env 镜像整体交付直接改版本号；bind mount 实例从 Release 附件解包覆盖后重放品牌补丁
          Release：$REL_URL
          > 🤖 来源：GitHub Actions · $GITHUB_WORKFLOW · $GITHUB_EVENT_NAME · $(date -u '+%F %T') UTC · [运行 #$GITHUB_RUN_ID]($RUN_URL)" \
            '{msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:$c},
              elements:[{tag:"markdown",content:$m}]}}' > payload.json
          resp=$(curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @payload.json "$WEBHOOK" || true)
          echo "feishu: $resp"
          echo "$resp" | grep -Eq '"(code|StatusCode|statusCode)"[ ]*:[ ]*0' || echo "::warning::飞书卡片发送未确认成功"

      # v2（评审 D5）：失败不再静默——推卡片到研发部群
      - name: Notify Feishu on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          jq -n --arg t "[$REPO] 🔴 中文镜像构建/推送失败（$IMAGE_TAG）" --arg c "red" \
            --arg m "版本：\`$IMAGE_TAG\`
          常见原因：BCP_REGISTRY_* 凭证缺失/过期/重置、ghcr.io/n8n-io/n8n:$IMAGE_TAG 基础镜像未发布、Release 资产 editor-ui*.tar.gz 缺失
          日志：$RUN_URL
          > 🤖 来源：GitHub Actions · $GITHUB_WORKFLOW · $GITHUB_EVENT_NAME · $(date -u '+%F %T') UTC · [运行 #$GITHUB_RUN_ID]($RUN_URL)" \
            '{msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:$c},
              elements:[{tag:"markdown",content:$m}]}}' > payload.json
          curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @payload.json "$WEBHOOK" || true

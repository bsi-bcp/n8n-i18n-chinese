name: Release Docker Image

on:
  release:
    types: [published]  # 当有新的 Release 发布时触发（需由 PAT 创建的 Release 才会触发，GITHUB_TOKEN 创建的不触发）
  workflow_dispatch:
    inputs:
      version:
        description: "中文包版本号（release/x.y.z 的数字部分，如 2.39.6；支持发布序号后缀如 2.39.7-v3→镜像 tag 2.39.7）；留空=自动取最新 Release"
        type: string
        default: ""
      allow_overwrite:
        description: "显式允许覆盖 SWR 已存在的同名 tag（合规重推场景）；自动链新版本无需传"
        type: boolean
        default: false
      mirror_only:
        description: "只跑「同步到私有库」这一步（跳过构建，约 1 分钟）——用于验证镜像步本身，不产生新镜像"
        type: boolean
        default: false

# 🔴 评审 D-E2 教训（3.5h 卡死 run 实证）：无超时的镜像构建曾卡 3.5 小时
concurrency:
  group: image-release
  cancel-in-progress: false

permissions:
  contents: read

# 🔴 启用本 workflow 前需在 repo secrets 配置 BCP_REGISTRY_USERNAME / BCP_REGISTRY_PASSWORD
#    （华为云 SWR 登录凭证：username=cn-north-4@AK，password=登录指令中 -p 的密钥，
#    真值见凭证库 swr.hwc_bj4；2026-09-19 自 TX-43 自建库 registry.bcpcloud.cn 迁移，
#    旧库存量 tag 不再更新；SWR 侧重置登录指令后须同步更新 secrets）
#
# v3（2026-09-19）设计变更：
# 1. 构建源从「checkout release tag」改为「下载 Release 资产 editor-ui*.tar.gz」——
#    2.39.7-v3 及更早的 tag 里没有 editor-ui-dist（dist 提交是 2.39.8 链才引入），
#    且旧 tag 的 Dockerfile 还是 DockerHub 基础镜像（runner 拉取限流卡死 35min+ 实锤）。
#    资产构建保证：dist 恒为该版发布物、Dockerfile/基础镜像恒为 main 最新。
# 2. buildx 加 --provenance=false --sbom=false——SWR 解析不了 buildx 默认生成的
#    provenance/attestation 附件 manifest（"Invalid image, fail to parse 'manifest.json'"
#    实锤，layer 推送正常、manifest 被拒）。

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: test
    # 90min（2026-09-21 实证：EE 清理重建两连超时——多架构构建+2GB×2 推 SWR 跑满 46min
    # 被旧 45min 上限取消；「正常 6-25 分钟」经验不可靠，与 watcher 90min 对齐）
    timeout-minutes: 90
    steps:
      # 🔒 安全修复（2026-09-18 评审 #2/#3）：inputs/tag_name 不再直接内插 shell，
      #    经 env 传入并强制 semver 白名单校验后才使用
      - name: Extract version
        id: extract_version
        env:
          EVT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="$EVT_TAG"
          else
            V="$INPUT_VERSION"
            if [ -z "$V" ]; then
              V=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                https://api.github.com/repos/${{ github.repository }}/releases/latest \
                | jq -r '.tag_name' | sed 's#^release/##')
            fi
            TAG="release/$V"
          fi
          VERSION="${TAG#release/}"
          VERSION="${VERSION#v}"
          # 允许发布序号后缀（2.39.7-v3），镜像 tag 取基础版本号（2.39.7）
          if ! [[ "$VERSION" =~ ^([0-9]+[.][0-9]+[.][0-9]+)(-v[0-9]+)?$ ]]; then
            echo "::error::版本号未通过 semver 白名单校验: '$VERSION'"
            exit 1
          fi
          IMAGE_TAG="${BASH_REMATCH[1]}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION (from $TAG) → image tag: $IMAGE_TAG"

      # v3：只取 main 的 Dockerfile/构建上下文（dist 来自 Release 资产，见下一步）
      - name: Checkout main (Dockerfile context)
        # 🔴 不加 mirror_only 守卫：镜像同步步需要仓库里的 script/registry-copy.py
        #    （2026-09-26 实跑踩中：跳过 checkout → can't open file .../script/registry-copy.py）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # EE 合规门禁（2026-09-21 评审 P1-3）：映射表随后被 COPY 进公开镜像（/opt/i18n-params/），
      # 构建前对 main 最新映射表独立复核——与 node.js.yml 的同名门禁形成双保险
      - name: EE 合规门禁（映射表）
        if: ${{ !inputs.mirror_only }}
        run: node script/check-ee-gate.cjs --map script/params-zh-map.json

      # v3：从 Release 资产取 dist（tag 里未必有 editor-ui-dist，资产恒有）
      - name: Download and unpack editor-ui dist
        if: ${{ !inputs.mirror_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.extract_version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "n8n-editor-ui@*.tar.gz" \
            --output /tmp/editor-ui.tar.gz
          # main 工作树可能已带 editor-ui-dist（dist 提交），先清空——构建源以 Release 资产为唯一真相
          rm -rf editor-ui-dist
          mkdir editor-ui-dist
          # 资产结构为 dist/ 顶层（tar -C 构建目录打包），剥掉一层得到 index.html/assets 布局
          tar -xzf /tmp/editor-ui.tar.gz -C editor-ui-dist --strip-components=1
          test -f editor-ui-dist/index.html || { echo "::error::dist 解包后无 index.html，资产结构异常"; exit 1; }
          echo "dist files: $(find editor-ui-dist -type f | wc -l)"

      - name: Set up Docker Buildx
        if: ${{ !inputs.mirror_only }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Huawei Cloud SWR
        if: ${{ !inputs.mirror_only }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: swr.cn-north-4.myhuaweicloud.com
          username: ${{ secrets.BCP_REGISTRY_USERNAME }}
          password: ${{ secrets.BCP_REGISTRY_PASSWORD }}

      # 🔒 覆盖防护（2026-09-21 评审 CI-N4）：同版本重推会静默覆盖客户已拉取的 SWR tag，
      #    无 digest 比对/标记可溯源——自动链对新版本此检查恒通过；合规重推显式传
      #    allow_overwrite=true 并在 CHANGELOG 留痕
      - name: SWR tag 覆盖防护
        if: ${{ !inputs.mirror_only }}
        env:
          ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
        run: |
          if docker buildx imagetools inspect "swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-chinese:$IMAGE_TAG" >/dev/null 2>&1; then
            if [ "$ALLOW_OVERWRITE" != "true" ]; then
              echo "::error::SWR 已存在 n8n-chinese:$IMAGE_TAG——覆盖会静默变更客户可拉取内容。合规重推请显式传 allow_overwrite=true"
              exit 1
            fi
            echo "⚠️ allow_overwrite=true：将覆盖已存在的 $IMAGE_TAG（须在 CHANGELOG 留痕）"
          else
            echo "✅ 新版本 tag $IMAGE_TAG，无覆盖风险"
          fi

      - name: Build and push multi-arch Docker images
        if: ${{ !inputs.mirror_only }}
        run: |
          # 构建并直接推送 multi-arch 镜像（amd64 + arm64）到华为云 SWR
          # --provenance=false --sbom=false：不带 attestation 附件 manifest
          # --output oci-mediatypes=false,compression=gzip：buildx 0.13+ 默认 OCI
          #   媒体类型 + zstd 层，SWR 解析器不认（"Invalid image, fail to parse
          #   'manifest.json'" 三连实锤；v2 API 实证 docker list 本身 SWR 是收的）
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --build-arg VERSION=$IMAGE_TAG \
            --output "type=registry,name=swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-chinese:$IMAGE_TAG,push=true,oci-mediatypes=false,compression=gzip" \
            .

          # 顺带交付 Queue Mode 用的 runners 镜像（官方镜像整体搬运，无汉化内容）
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --build-arg VERSION=$IMAGE_TAG \
            --output "type=registry,name=swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-runners:$IMAGE_TAG,push=true,oci-mediatypes=false,compression=gzip" \
            -f Dockerfile.runners \
            .

      # ── 私有库 bcp-hub/ 同步（2026-09-25 用户定：镜像源统一从 registry.bcpcloud.cn 取）──
      # 🔴 为什么放在 runner 上做拷贝、而不是在 TX-43 本地搬：
      #    2026-09-25 实测，TX-43 上 `docker pull` 只取宿主架构（amd64），`docker buildx imagetools
      #    create` 跨库拷贝会卡死（同库复制也卡）；而 GitHub runner 网络干净，imagetools 的
      #    registry→registry 拷贝（保多架构、不落地层）可正常工作。
      # 🔴 平台一致性校验必不可少：丢架构的失败是**静默的**（只有一行 INFO），必须断言集合相等。
      - name: Log in to private registry (registry.bcpcloud.cn)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.bcpcloud.cn
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}

      - name: Mirror images to private registry (bcp-hub/)
        # 🔴 2026-09-26 换实现：`docker buildx imagetools create`（Go/HTTP/2）→ 仓库内 script/registry-copy.py
        #    （Python urllib，HTTP/1.1 直连 Registry v2 API）。原因（两次实跑实测）：
        #      ① 私有库（registry:2 前置 Caddy）对大 blob 的 HTTP/2 流回 RST_STREAM
        #         → `stream error: stream ID 15; INTERNAL_ERROR; received from peer`
        #      ② 加 GODEBUG=http2client=0 + 重试后**退化为无进展挂起**：43 分钟零进展 → 撞 90min 作业超时
        #    脚本方法 2026-09-25 已用于修复受损镜像（外部逐层拉取验证通过），且本地实测两条路径：
        #      幂等（目标已有）2.1s；真实搬运（busybox 小镜像）2.9s —— 均 digest 一致。
        #    脚本自带 digest 校验（内容寻址 ⇒ 等价于"平台集合不丢"），下方平台断言作第二道独立闸。
        env:
          SWR_USER: ${{ secrets.BCP_REGISTRY_USERNAME }}
          SWR_PASS: ${{ secrets.BCP_REGISTRY_PASSWORD }}
          REG_USER: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
        run: |
          set -e
          for img in n8n-chinese n8n-runners; do
            SRC="swr.cn-north-4.myhuaweicloud.com/bcphub/${img}:$IMAGE_TAG"
            DST="registry.bcpcloud.cn/bcp-hub/${img}:$IMAGE_TAG"
            echo "──── $img ────"
            python3 script/registry-copy.py --from "$SRC" --to "$DST"
            sp=$(docker buildx imagetools inspect "$SRC" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
            dp=$(docker buildx imagetools inspect "$DST" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
            if [ "$sp" != "$dp" ]; then
              echo "::error::平台集合不一致 $img — 源[$sp] 目标[$dp]（镜像已丢架构，不得视为成功）"
              exit 1
            fi
            echo "✅ $DST  平台 [$dp]"
          done

      # 部署成功通知（2026-09-18）：镜像推送完成 → 研发部群卡片（交付物就绪提醒）
      - name: Notify Feishu on success
        if: success()
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPO: ${{ github.repository }}
          REL_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.extract_version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg t "[$REPO] 🟢 中文镜像已发布（$IMAGE_TAG）" --arg c "green" \
            --arg m "版本：\`$IMAGE_TAG\`
          镜像：\`swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-chinese:$IMAGE_TAG\`（amd64 + arm64）
          Runners：\`swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-runners:$IMAGE_TAG\`（Queue Mode 用）
          客户实例升级：.env 镜像整体交付直接改版本号；bind mount 实例从 Release 附件解包覆盖后重放品牌补丁
          Release：$REL_URL
          > 🤖 来源：GitHub Actions · $GITHUB_WORKFLOW · $GITHUB_EVENT_NAME · $(date -u '+%F %T') UTC · [运行 #$GITHUB_RUN_ID]($RUN_URL)" \
            '{msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:$c},
              elements:[{tag:"markdown",content:$m}]}}' > payload.json
          resp=$(curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @payload.json "$WEBHOOK" || true)
          echo "feishu: $resp"
          echo "$resp" | grep -Eq '"(code|StatusCode|statusCode)"[ ]*:[ ]*0' || echo "::warning::飞书卡片发送未确认成功"

      # v2（评审 D5）：失败不再静默——推卡片到研发部群
      - name: Notify Feishu on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          jq -n --arg t "[$REPO] 🔴 中文镜像构建/推送失败（$IMAGE_TAG）" --arg c "red" \
            --arg m "版本：\`$IMAGE_TAG\`
          常见原因：BCP_REGISTRY_* 凭证缺失/过期/重置、ghcr.io/n8n-io/n8n:$IMAGE_TAG 基础镜像未发布、Release 资产 editor-ui*.tar.gz 缺失、参数注入路径不存在（@n8n/n8n-nodes-langchain 等包在官方镜像内布局变化，查 Dockerfile RUN 注入段）
          日志：$RUN_URL
          > 🤖 来源：GitHub Actions · $GITHUB_WORKFLOW · $GITHUB_EVENT_NAME · $(date -u '+%F %T') UTC · [运行 #$GITHUB_RUN_ID]($RUN_URL)" \
            '{msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:$c},
              elements:[{tag:"markdown",content:$m}]}}' > payload.json
          curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @payload.json "$WEBHOOK" || true

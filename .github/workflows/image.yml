name: Release Docker Image

on:
  release:
    types: [published]  # 当有新的 Release 发布时触发（需由 PAT 创建的 Release 才会触发，GITHUB_TOKEN 创建的不触发）
  workflow_dispatch:
    inputs:
      version:
        description: "中文包版本号（release/x.y.z 的数字部分，如 2.39.6）；留空=自动取最新 Release"
        type: string
        default: ""

permissions:
  contents: read

# 🔴 启用本 workflow 前需在 repo secrets 配置 BCP_REGISTRY_USERNAME / BCP_REGISTRY_PASSWORD
#    （registry.bcpcloud.cn htpasswd 账号，真值见凭证库 swr.txc_43）

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: test
    steps:
      # 🔒 安全修复（2026-09-18 评审 #2/#3）：inputs/tag_name 不再直接内插 shell，
      #    经 env 传入并强制 semver 白名单校验后才使用
      - name: Extract version
        id: extract_version
        env:
          EVT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="$EVT_TAG"
          else
            V="$INPUT_VERSION"
            if [ -z "$V" ]; then
              V=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                https://api.github.com/repos/${{ github.repository }}/releases/latest \
                | jq -r '.tag_name' | sed 's#^release/##')
            fi
            TAG="release/$V"
          fi
          VERSION="${TAG#release/}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::版本号未通过 semver 白名单校验: '$VERSION'"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION (from $TAG)"

      # v2：无论 release 事件还是手动 dispatch，都 checkout 产物所在 tag
      #（原先 dispatch 路径 checkout main，而 editor-ui-dist 只存在于 release tag 的提交里）
      - name: Checkout tag code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.extract_version.outputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to BCP Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.bcpcloud.cn
          username: ${{ secrets.BCP_REGISTRY_USERNAME }}
          password: ${{ secrets.BCP_REGISTRY_PASSWORD }}

      - name: Build and push multi-arch Docker images
        run: |
          # 构建并直接推送 multi-arch 镜像（amd64 + arm64）到商软库
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=$RELEASE_VERSION \
            -t registry.bcpcloud.cn/bcp/bcphub-n8n/n8n-chinese:$RELEASE_VERSION \
            --push \
            .

      # 部署成功通知（2026-09-18）：镜像推送完成 → 研发部群卡片（交付物就绪提醒）
      - name: Notify Feishu on success
        if: success()
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPO: ${{ github.repository }}
          REL_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.extract_version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg t "[$REPO] 🟢 中文镜像已发布（$RELEASE_VERSION）" --arg c "green" \
            --arg m "版本：\`$RELEASE_VERSION\`
          镜像：\`registry.bcpcloud.cn/bcp/bcphub-n8n/n8n-chinese:$RELEASE_VERSION\`（amd64 + arm64）
          客户实例升级：.env 镜像整体交付直接改版本号；bind mount 实例从 Release 附件解包覆盖后重放品牌补丁
          Release：$REL_URL
          > 🤖 来源：GitHub Actions · $GITHUB_WORKFLOW · $GITHUB_EVENT_NAME · $(date -u '+%F %T') UTC · [运行 #$GITHUB_RUN_ID]($RUN_URL)" \
            '{msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:$c},
              elements:[{tag:"markdown",content:$m}]}}' > payload.json
          resp=$(curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @payload.json "$WEBHOOK" || true)
          echo "feishu: $resp"
          echo "$resp" | grep -Eq '"(code|StatusCode|statusCode)"[ ]*:[ ]*0' || echo "::warning::飞书卡片发送未确认成功"

      # v2（评审 D5）：失败不再静默——推卡片到研发部群
      - name: Notify Feishu on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          jq -n --arg t "[$REPO] 🔴 中文镜像构建/推送失败（$RELEASE_VERSION）" --arg c "red" \
            --arg m "版本：\`$RELEASE_VERSION\`
          常见原因：BCP_REGISTRY_* 凭证缺失/过期、n8nio/n8n:$RELEASE_VERSION 基础镜像未发布、dist 产物缺失
          日志：$RUN_URL
          > 🤖 来源：GitHub Actions · $GITHUB_WORKFLOW · $GITHUB_EVENT_NAME · $(date -u '+%F %T') UTC · [运行 #$GITHUB_RUN_ID]($RUN_URL)" \
            '{msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:$c},
              elements:[{tag:"markdown",content:$m}]}}' > payload.json
          curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @payload.json "$WEBHOOK" || true

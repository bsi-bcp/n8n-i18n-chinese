name: Release Docker Image

on:
  release:
    types: [published]  # 当有新的 Release 发布时触发（需由 PAT 创建的 Release 才会触发，GITHUB_TOKEN 创建的不触发）
  workflow_dispatch:
    inputs:
      version:
        description: "中文包版本号（release/x.y.z 的数字部分，如 2.39.6；支持发布序号后缀如 2.39.7-v3→镜像 tag 2.39.7）；留空=自动取最新 Release"
        type: string
        default: ""
      allow_overwrite:
        description: "显式允许覆盖 SWR 已存在的同名 tag（合规重推场景）；自动链新版本无需传"
        type: boolean
        default: false
      mirror_only:
        description: "只跑「双路分发」（跳过构建，要求 GHCR 已有本次镜像 tag）——用于分发重放/验证，不产生新构建"
        type: boolean
        default: false

# 🔴 评审 D-E2 教训（3.5h 卡死 run 实证）：无超时的镜像构建曾卡 3.5 小时
concurrency:
  group: image-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # v4：构建产物推 ghcr.io 中转站

# 🔴 启用本 workflow 前需在 repo secrets 配置 BCP_REGISTRY_USERNAME / BCP_REGISTRY_PASSWORD
#    （华为云 SWR 登录凭证：username=cn-north-4@AK，password=登录指令中 -p 的密钥，
#    真值见凭证库 swr.hwc_bj4；2026-09-19 自 TX-43 自建库 registry.bcpcloud.cn 迁移，
#    旧库存量 tag 不再更新；SWR 侧重置登录指令后须同步更新 secrets）
#
# v3（2026-09-19）设计变更：
# 1. 构建源从「checkout release tag」改为「下载 Release 资产 editor-ui*.tar.gz」——
#    2.39.7-v3 及更早的 tag 里没有 editor-ui-dist（dist 提交是 2.39.8 链才引入），
#    且旧 tag 的 Dockerfile 还是 DockerHub 基础镜像（runner 拉取限流卡死 35min+ 实锤）。
#    资产构建保证：dist 恒为该版发布物、Dockerfile/基础镜像恒为 main 最新。
# 2. buildx 加 --provenance=false --sbom=false——SWR 解析不了 buildx 默认生成的
#    provenance/attestation 附件 manifest（"Invalid image, fail to parse 'manifest.json'"
#    实锤，layer 推送正常、manifest 被拒）。

# v4（2026-09-30）设计变更（SWR 直推四连败复盘，详见当日 run 36679779714）：
# 1. 中转站 SWR → GHCR：GitHub runner 跨境直推 SWR 在全新层场景（2GB×2 架构）HTTP/2
#    单流静默挂死（50min 零进度实证）；GHCR 同区秒级稳定。SWR 兼容形态
#    （oci-mediatypes=false,compression=gzip）在入 GHCR 时即定型——registry-copy
#    逐字节搬运不做媒体类型转换。
# 2. registry-copy.py 双路分发：n8n-chinese **仅 amd64**（2026-09-30 用户定稿：
#    arm64 暂不支持汉化镜像，SWR 与 bcp-hub 同此；顺带免去 QEMU arm64 冷构建大头）；
#    n8n-runners 双库均 amd64（2026-10-01 追加定稿：arm64 变体无任何消费者，
#    砍多架构构建——冷构建时长再省一半，SWR/私有库口径完全一致）。
#    🔴 arm64 实例的汉化支持通道 = Release 附件补丁包 n8n-editor-ui@<ver>.tar.gz
#    （上游 arm64 镜像 + 解包覆盖 dist + 品牌重放），由 Release 管线照常产出，与本镜像链路解耦。
# 3. timeout 90→300 + buildx gha 层缓存（镜像内门禁层冷构建 ~39min 跨次复用，
#    否则「冷构建+全量分发」在任何上限下都是赌博）。

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: test
    # 300min（2026-09-30 定稿）：冷构建 ~40min（全新层；层缓存命中则 4-5min）
    #   + GHCR 推送 + registry-copy 跨境逐 blob 双库分发（2-4GB）。
    #   旧 90min 四连败实证（09-29/30），「正常 6-25 分钟」仅适用于缓存命中场景。
    timeout-minutes: 300
    steps:
      # 🔒 安全修复（2026-09-18 评审 #2/#3）：inputs/tag_name 不再直接内插 shell，
      #    经 env 传入并强制 semver 白名单校验后才使用
      - name: Extract version
        id: extract_version
        env:
          EVT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="$EVT_TAG"
          else
            V="$INPUT_VERSION"
            if [ -z "$V" ]; then
              V=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                https://api.github.com/repos/${{ github.repository }}/releases/latest \
                | jq -r '.tag_name' | sed 's#^release/##')
            fi
            TAG="release/$V"
          fi
          VERSION="${TAG#release/}"
          VERSION="${VERSION#v}"
          # 允许发布序号后缀（2.39.7-v3），镜像 tag 取基础版本号（2.39.7）
          if ! [[ "$VERSION" =~ ^([0-9]+[.][0-9]+[.][0-9]+)(-v[0-9]+)?$ ]]; then
            echo "::error::版本号未通过 semver 白名单校验: '$VERSION'"
            exit 1
          fi
          IMAGE_TAG="${BASH_REMATCH[1]}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION (from $TAG) → image tag: $IMAGE_TAG"

      # v3：只取 main 的 Dockerfile/构建上下文（dist 来自 Release 资产，见下一步）
      - name: Checkout main (Dockerfile context)
        # 🔴 不加 mirror_only 守卫：镜像同步步需要仓库里的 script/registry-copy.py
        #    （2026-09-26 实跑踩中：跳过 checkout → can't open file .../script/registry-copy.py）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # EE 合规门禁（2026-09-21 评审 P1-3）：映射表随后被 COPY 进公开镜像（/opt/i18n-params/），
      # 构建前对 main 最新映射表独立复核——与 node.js.yml 的同名门禁形成双保险
      - name: EE 合规门禁（映射表）
        if: ${{ !inputs.mirror_only }}
        run: node script/check-ee-gate.cjs --map script/params-zh-map.json

      # v3：从 Release 资产取 dist（tag 里未必有 editor-ui-dist，资产恒有）
      - name: Download and unpack editor-ui dist
        if: ${{ !inputs.mirror_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.extract_version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "n8n-editor-ui@*.tar.gz" \
            --output /tmp/editor-ui.tar.gz
          # main 工作树可能已带 editor-ui-dist（dist 提交），先清空——构建源以 Release 资产为唯一真相
          rm -rf editor-ui-dist
          mkdir editor-ui-dist
          # 资产结构为 dist/ 顶层（tar -C 构建目录打包），剥掉一层得到 index.html/assets 布局
          tar -xzf /tmp/editor-ui.tar.gz -C editor-ui-dist --strip-components=1
          test -f editor-ui-dist/index.html || { echo "::error::dist 解包后无 index.html，资产结构异常"; exit 1; }
          echo "dist files: $(find editor-ui-dist -type f | wc -l)"

      - name: Set up Docker Buildx
        if: ${{ !inputs.mirror_only }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io (v4 中转站)
        if: ${{ !inputs.mirror_only }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Huawei Cloud SWR
        if: ${{ !inputs.mirror_only }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: swr.cn-north-4.myhuaweicloud.com
          username: ${{ secrets.BCP_REGISTRY_USERNAME }}
          password: ${{ secrets.BCP_REGISTRY_PASSWORD }}

      # 🔒 覆盖防护（2026-09-21 评审 CI-N4）：同版本重推会静默覆盖客户已拉取的 SWR tag，
      #    无 digest 比对/标记可溯源——自动链对新版本此检查恒通过；合规重推显式传
      #    allow_overwrite=true 并在 CHANGELOG 留痕
      - name: SWR tag 覆盖防护
        if: ${{ !inputs.mirror_only }}
        env:
          ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
        run: |
          if docker buildx imagetools inspect "swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-chinese:$IMAGE_TAG" >/dev/null 2>&1; then
            if [ "$ALLOW_OVERWRITE" != "true" ]; then
              echo "::error::SWR 已存在 n8n-chinese:$IMAGE_TAG——覆盖会静默变更客户可拉取内容。合规重推请显式传 allow_overwrite=true"
              exit 1
            fi
            echo "⚠️ allow_overwrite=true：将覆盖已存在的 $IMAGE_TAG（须在 CHANGELOG 留痕）"
          else
            echo "✅ 新版本 tag $IMAGE_TAG，无覆盖风险"
          fi

      - name: Build and push to ghcr.io (v4 中转站)
        if: ${{ !inputs.mirror_only }}
        run: |
          # v4：构建推 GHCR 中转站，不再直推 SWR（跨境 HTTP/2 静默挂死，见头注 v4-1）。
          # SWR 兼容形态（oci-mediatypes=false,compression=gzip）在入 GHCR 时即定型。
          # cache-from/to gha：镜像内门禁层跨次复用。
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"

          # ① n8n-chinese：仅 amd64（2026-09-30 定稿：arm64 暂不支持汉化镜像；
          #    单架构同时免去 QEMU arm64 的冷构建大头）
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg VERSION=$IMAGE_TAG \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output "type=registry,name=ghcr.io/$OWNER_LC/n8n-chinese:$IMAGE_TAG,push=true,oci-mediatypes=false,compression=gzip" \
            .

          # ② n8n-runners 仅 amd64（2026-10-01 追加定稿：arm64 变体无消费者，砍多架构构建）
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg VERSION=$IMAGE_TAG \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output "type=registry,name=ghcr.io/$OWNER_LC/n8n-runners:$IMAGE_TAG-amd64,push=true,oci-mediatypes=false,compression=gzip" \
            -f Dockerfile.runners \
            .

      # ── v4 双路分发（2026-09-30）：源从 SWR 改 GHCR（跨境读慢），registry-copy.py
      #    HTTP/1.1 逐 blob + 重试。bcp-hub（业务消费端）先跑，SWR（源头镜像）后跑。
      #    n8n-chinese 仅 amd64（arm64 暂不支持汉化镜像）；runners 双路按位分发。
      #    🔴 私有库 docker login 不可省：分发走脚本 env 凭证，但下方平台断言的
      #       imagetools inspect 需要它（registry.bcpcloud.cn 匿名 401 实证）──
      - name: Log in to private registry (registry.bcpcloud.cn)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.bcpcloud.cn
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}

      - name: Mirror n8n-chinese amd64 → SWR + bcp-hub
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ secrets.GITHUB_TOKEN }}
          SWR_USER: ${{ secrets.BCP_REGISTRY_USERNAME }}
          SWR_PASS: ${{ secrets.BCP_REGISTRY_PASSWORD }}
          REG_USER: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
        run: |
          set -e
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          SRC="ghcr.io/$OWNER_LC/n8n-chinese:$IMAGE_TAG"
          for DST in "swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-chinese:$IMAGE_TAG" \
                     "registry.bcpcloud.cn/bcp-hub/n8n-chinese:$IMAGE_TAG"; do
            echo "──── $SRC → $DST ────"
            python3 script/registry-copy.py --from "$SRC" --to "$DST"
            # 单架构断言：raw manifest 不得是 index（arm64 暂不支持汉化镜像，防回归）
            if docker buildx imagetools inspect "$DST" --raw | jq -e '.manifests' >/dev/null 2>&1; then
              echo "::error::$DST 应为 amd64 单架构 manifest，实为多架构 index"
              exit 1
            fi
            echo "✅ $DST（amd64 单架构）"
          done

      - name: Mirror n8n-runners amd64 → SWR + bcp-hub
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ secrets.GITHUB_TOKEN }}
          SWR_USER: ${{ secrets.BCP_REGISTRY_USERNAME }}
          SWR_PASS: ${{ secrets.BCP_REGISTRY_PASSWORD }}
          REG_USER: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
        run: |
          set -e
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          SRC="ghcr.io/$OWNER_LC/n8n-runners:$IMAGE_TAG-amd64"
          for DST in "swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-runners:$IMAGE_TAG" \
                     "registry.bcpcloud.cn/bcp-hub/n8n-runners:$IMAGE_TAG"; do
            echo "──── $SRC → $DST ────"
            python3 script/registry-copy.py --from "$SRC" --to "$DST"
            # 单架构断言：raw manifest 不得是 index（arm64 已砍，防回归）
            if docker buildx imagetools inspect "$DST" --raw | jq -e '.manifests' >/dev/null 2>&1; then
              echo "::error::$DST 应为 amd64 单架构 manifest，实为多架构 index"
              exit 1
            fi
            echo "✅ $DST（amd64 单架构）"
          done

      - name: Mirror sandbox images to private registry (ghcr → bcp-hub)
        # 沙箱服务（AI Assistant 用）来自上游公共库 ghcr.io —— 边端直拉 ghcr 不稳，
        # 故一并镜像进私有库，让边端只依赖 registry.bcpcloud.cn。
        # 🔴 2026-09-26：此前 bcp-hub 里那两个 tag 与上游 digest 不一致（`d115bbc6…` vs `23d7fbc0…`），
        #    疑为早期用 docker pull+push 搬的——**会丢多架构**。本步用 registry-copy.py 重搬并校验 digest，
        #    顺带把已有失真副本覆盖为保真副本。
        # ⚠️ SANDBOX_TAG 必须与 deploy-* 分支 compose 里的 ghcr.io/n8n-io/n8n-sandbox-service-*:tag 一致；
        #    n8n 升级 bump 沙箱版本时同步改这里（忘了改 → 边端拉不到，会回退到公共库或失败）。
        env:
          SANDBOX_TAG: "1.2.0"
          SWR_USER: ${{ secrets.BCP_REGISTRY_USERNAME }}
          SWR_PASS: ${{ secrets.BCP_REGISTRY_PASSWORD }}
          REG_USER: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
        run: |
          set -e
          for img in n8n-sandbox-service-api n8n-sandbox-service-runner-dind; do
            SRC="ghcr.io/n8n-io/${img}:${SANDBOX_TAG}"
            DST="registry.bcpcloud.cn/bcp-hub/${img}:${SANDBOX_TAG}"
            echo "──── $img ────"
            python3 script/registry-copy.py --from "$SRC" --to "$DST"
            sp=$(docker buildx imagetools inspect "$SRC" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
            dp=$(docker buildx imagetools inspect "$DST" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
            [ "$sp" = "$dp" ] || { echo "::error::平台集合不一致 $img — 源[$sp] 目标[$dp]"; exit 1; }
            echo "✅ $DST  平台 [$dp]"
          done

      # 部署成功通知（2026-09-18）：镜像推送完成 → 研发部群卡片（交付物就绪提醒）
      - name: Notify Feishu on success
        if: success()
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPO: ${{ github.repository }}
          REL_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.extract_version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg t "[$REPO] 🟢 中文镜像已发布（$IMAGE_TAG）" --arg c "green" \
            --arg m "版本：\`$IMAGE_TAG\`
          镜像（仅 amd64，arm64 暂不支持汉化）：
          SWR \`swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-chinese:$IMAGE_TAG\`
          私有库 \`registry.bcpcloud.cn/bcp-hub/n8n-chinese:$IMAGE_TAG\`
          Runners（SWR 多架构 / 私有库仅 amd64）：\`…/n8n-runners:$IMAGE_TAG\`（两库同名 tag）
          arm64 实例：不支持汉化镜像——用 Release 附件补丁包 \`n8n-editor-ui@$IMAGE_TAG.tar.gz\` 解包覆盖 dist + 品牌重放
          客户实例升级：.env 镜像整体交付直接改版本号；bind mount 实例从 Release 附件解包覆盖后重放品牌补丁
          Release：$REL_URL
          > 🤖 来源：GitHub Actions · $GITHUB_WORKFLOW · $GITHUB_EVENT_NAME · $(date -u '+%F %T') UTC · [运行 #$GITHUB_RUN_ID]($RUN_URL)" \
            '{msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:$c},
              elements:[{tag:"markdown",content:$m}]}}' > payload.json
          resp=$(curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @payload.json "$WEBHOOK" || true)
          echo "feishu: $resp"
          echo "$resp" | grep -Eq '"(code|StatusCode|statusCode)"[ ]*:[ ]*0' || echo "::warning::飞书卡片发送未确认成功"

      # v2（评审 D5）：失败不再静默——推卡片到研发部群
      - name: Notify Feishu on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          jq -n --arg t "[$REPO] 🔴 中文镜像构建/推送失败（$IMAGE_TAG）" --arg c "red" \
            --arg m "版本：\`$IMAGE_TAG\`
          常见原因：BCP_REGISTRY_* 凭证缺失/过期/重置、ghcr.io/n8n-io/n8n:$IMAGE_TAG 基础镜像未发布、Release 资产 editor-ui*.tar.gz 缺失、参数注入路径不存在（@n8n/n8n-nodes-langchain 等包在官方镜像内布局变化，查 Dockerfile RUN 注入段）
          日志：$RUN_URL
          > 🤖 来源：GitHub Actions · $GITHUB_WORKFLOW · $GITHUB_EVENT_NAME · $(date -u '+%F %T') UTC · [运行 #$GITHUB_RUN_ID]($RUN_URL)" \
            '{msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:$c},
              elements:[{tag:"markdown",content:$m}]}}' > payload.json
          curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @payload.json "$WEBHOOK" || true

name: Release Docker Image

on:
  release:
    types: [published]  # 当有新的 Release 发布时触发
  workflow_dispatch:
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout tag code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔴 启用本 workflow 前需在 repo secrets 配置 BCP_REGISTRY_USERNAME / BCP_REGISTRY_PASSWORD
      #    （registry.bcpcloud.cn htpasswd 账号，真值见凭证库 swr.txc_43）
      - name: Log in to BCP Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bcpcloud.cn
          username: ${{ secrets.BCP_REGISTRY_USERNAME }}
          password: ${{ secrets.BCP_REGISTRY_PASSWORD }}

      - name: Extract version from release tag
        id: extract_version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#release/}"
          else
            VERSION=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/releases/latest \
              | jq -r '.tag_name')
          
            VERSION="${VERSION#release/}"
          fi
          
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Build and push multi-arch Docker images
        run: |
          # 构建并直接推送 multi-arch 镜像（amd64 + arm64）到商软库
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=$RELEASE_VERSION \
            -t registry.bcpcloud.cn/bcp/bcphub-n8n/n8n-chinese:$RELEASE_VERSION \
            --push \
            .

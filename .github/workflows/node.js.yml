# 构建 n8n 简体中文汉化补丁包并发版（2026-09-18 起收窄为补丁包模式）：
#   入口统一为 n8n-stable-watch.yml 评估通过后 dispatch（或人工 dispatch 并传 version）
#   自动化只产出「汉化补丁包」= zh-CN 词典 + 源码补丁 + manifest（Release 附件）；
#   完整 editor-ui dist / Docker 镜像回归人工 runbook 构建（三轮实战验证的可靠路径；
#   CI 全量构建在 2.39.8 首日实战连环暴露 3 缺陷后移出自动化）
#   原每小时 cron 已移除（避免绕过兼容性评估盲跑，且与 watcher 双触发）
name: package zh-CN patch bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "n8n 版本号（如 2.39.8）；留空=自动取最新稳定 tag（不推荐）"
        type: string
        default: ""

permissions:
  contents: write  # 翻译提交 + release tag + Release 附件
  # ⚠️ 不可加 workflows:write——GITHUB_TOKEN 不支持该 scope，声明即整个文件非法
  #    （startup_failure，dispatch 同被拒，2.39.8 实锤）。tag 推送的 workflow 提交
  #    竞态用「打 tag 前 rebase origin/main」策略规避。

jobs:
  build:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    steps:
    - name: Resolve n8n version (input 优先，兜底稳定 tag)
      id: ver
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # 🔒 输入只经 env 进入 shell（防表达式内插注入），并强制裁剪为 semver 白名单
        if [ -n "$INPUT_VERSION" ]; then
          VERSION="$INPUT_VERSION"
        else
          VERSION=$(curl -s https://api.github.com/repos/n8n-io/n8n/releases?per_page=30 | jq -r '
            [ .[] | select(.draft == false and .prerelease == false)
                   | select(.tag_name | test("^n8n@[0-9]+[.][0-9]+[.][0-9]+$"))
                   | .tag_name | ltrimstr("n8n@") ]
            | sort_by(split(".") | map(tonumber)) | last // empty')
        fi
        VERSION="${VERSION#v}"
        if ! [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
          echo "::error::版本号未通过 semver 白名单校验: '$VERSION'"
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "n8n tag: n8n@$VERSION / 本仓 tag: release/$VERSION"

    - name: Install pnpm
      run: npm install -g pnpm@10

    - name: Checkout local
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        path: ./n8n-i18n-chinese

    - name: Check if tag exists
      id: check_tag
      run: |
        TAG="release/${{ steps.ver.outputs.version }}"
        echo "Checking for remote tag: $TAG"
        if git ls-remote --tags origin | grep "refs/tags/$TAG$"; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese

    - name: Exit if tags exist
      if: steps.check_tag.outputs.exists == 'true'
      run: |
        echo "Tags exist, stopping workflow."

    - name: Translate New Strings
      if: steps.check_tag.outputs.exists == 'false'
      run: pnpm install && N8N_EN_JSON_URL="https://raw.githubusercontent.com/n8n-io/n8n/n8n%40${{ steps.ver.outputs.version }}/packages/frontend/%40n8n/i18n/src/locales/en.json" node translate.js
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
        OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        OPENAI_API_CONCURRENT: ${{ vars.OPENAI_API_CONCURRENT }}
        OPENAI_BATCH_SIZE: ${{ vars.OPENAI_BATCH_SIZE }}

    # 词典覆盖率门禁（2026-09-18 复盘新增）：translate.js 对 LLM 失败条目只记日志跳过、
    # 进程仍退出 0——API 余额耗尽时缺译词典会带病入库且零告警。这里先补翻一轮
    # （zh 缺失键即补翻条件，瞬时故障自愈），仍超阈值则失败，由红卡兜底。
    - name: 词典覆盖率门禁（缺失>0 补翻一轮，补后 >1% 失败）
      if: steps.check_tag.outputs.exists == 'false'
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
        OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        OPENAI_API_CONCURRENT: ${{ vars.OPENAI_API_CONCURRENT }}
        OPENAI_BATCH_SIZE: ${{ vars.OPENAI_BATCH_SIZE }}
        UPSTREAM_EN: "https://raw.githubusercontent.com/n8n-io/n8n/n8n%40${{ steps.ver.outputs.version }}/packages/frontend/%40n8n/i18n/src/locales/en.json"
      run: |
        miss() {
          jq -n --slurpfile en en.json --slurpfile zh ../languages/zh-CN.json \
            '[($en[0]|paths(scalars)) as $p | select(($zh[0]|getpath($p)) == null)] | length'
        }
        total() {
          jq '[paths(scalars)] | length' en.json
        }
        MISS=$(miss); TOTAL=$(total)
        echo "zh 缺失 $MISS / 共 $TOTAL 键"
        if [ "$MISS" -gt 0 ]; then
          echo "::warning::首轮翻译缺失 $MISS 条（LLM 失败被静默跳过），补翻一轮…"
          N8N_EN_JSON_URL="$UPSTREAM_EN" node translate.js
          MISS=$(miss)
          echo "补翻后缺失：$MISS"
        fi
        if [ "$((MISS * 100))" -gt "$TOTAL" ]; then
          echo "::error::词典覆盖率不足 99%（缺失 $MISS/$TOTAL），疑似 LLM API 持续失败，阻断发版"
          exit 1
        fi

    - name: Translate Publish Git
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git add languages/* script/en.json || true

        # 如果没有变更就跳过
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "chore: auto translate for n8n@${{ steps.ver.outputs.version }}"
        fi
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese

    # 组装汉化补丁包：词典 + 源码补丁 + manifest + 应用说明（Release 附件）
    - name: 组装汉化补丁包
      if: steps.check_tag.outputs.exists == 'false'
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese
      run: |
        VERSION="${{ steps.ver.outputs.version }}"
        ZH_KEYS=$(jq '[paths(scalars)] | length' languages/zh-CN.json)
        EN_KEYS=$(jq '[paths(scalars)] | length' script/en.json)
        jq -n --arg v "$VERSION" --argjson zh "$ZH_KEYS" --argjson en "$EN_KEYS" \
          '{version:$v, n8n_tag:("n8n@"+$v), generated_at:(now|todateiso8601),
            zh_keys:$zh, en_keys:$en,
            patches:["feat__i18n_zhCn.patch","feat__node_creator_actions_i18n.patch","fix__hardcoded_labels.patch","fix_editor-ui.patch"],
            note:"fix_editor-ui.patch 仅 ≤2.33 旧目录布局构建需要；≥2.38 上游已自修，新版忽略"}' > patch-manifest.json
        cat > README-应用说明.md <<'MD'
        # n8n 简体中文汉化补丁包

        内容：`languages/zh-CN.json` 中文词典、`patches/` 源码补丁、`script/en.json` 英文基准、`patch-manifest.json` 版本信息。

        应用（对应 n8n 源码 tag `n8n@<版本>`，见 manifest.json）：
        1. 将 `languages/zh-CN.json` 拷入 n8n 源码 `packages/frontend/@n8n/i18n/src/locales/`
        2. 在 n8n 源码根目录执行：
           git apply patches/feat__i18n_zhCn.patch patches/feat__node_creator_actions_i18n.patch patches/fix__hardcoded_labels.patch
        3. 仅构建 ≤2.33 旧目录布局时另加：git apply patches/fix_editor-ui.patch
        4. 构建 editor-ui dist；用户侧设 N8N_DEFAULT_LOCALE=zh-CN 生效

        完整构建步骤见本仓库 CLAUDE.md「手动构建发布 runbook」。
        MD
        EXTRA=""
        [ -f script/en-nodes.json ] && EXTRA="script/en-nodes.json"
        # shellcheck disable=SC2086
        tar -czf "n8n-zh-patch-$VERSION.tar.gz" languages/zh-CN.json script/en.json $EXTRA \
          patches/feat__i18n_zhCn.patch patches/feat__node_creator_actions_i18n.patch \
          patches/fix__hardcoded_labels.patch patches/fix_editor-ui.patch \
          patch-manifest.json README-应用说明.md
        echo "---- 补丁包内容 ----"
        tar -tzf "n8n-zh-patch-$VERSION.tar.gz"

    # 🔒 打 tag 前 rebase origin/main：构建窗口内 main 的 workflow 提交不得进入 tag 历史
    #    （GITHUB_TOKEN 无 workflows scope 可授，push 携带未入库的 workflow 变更会被
    #    GitHub 拒收——2.39.8 首跑实锤）。补丁包模式无长构建窗口，竞态窗口趋近于零。
    - name: 创建 git tag 并推送
      if: steps.check_tag.outputs.exists == 'false'
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese
      run: |
        TAG="release/${{ steps.ver.outputs.version }}"
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git fetch origin main
        git rebase origin/main
        git tag $TAG
        git push origin main
        git push origin $TAG

    - name: 创建 GitHub Release（补丁包附件）
      if: steps.check_tag.outputs.exists == 'false'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        tag_name: release/${{ steps.ver.outputs.version }}
        name: n8n@${{ steps.ver.outputs.version }} 简体中文汉化补丁包
        body: |
          自动发布的 n8n 简体中文汉化**补丁包**（对应 n8n@${{ steps.ver.outputs.version }}）。

          - 附件 `n8n-zh-patch-*.tar.gz`：zh-CN 词典 + 源码补丁 + manifest 与应用说明
          - ⚠️ 不含完整 editor-ui dist；完整汉化包（dist / Docker 镜像）按仓库 runbook 人工构建
          - 客户正式交付通道为 registry 镜像（`registry.bcpcloud.cn/bcp/bcphub-n8n/n8n-chinese:<ver>`）
        draft: false
        prerelease: false
        files: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/n8n-zh-patch-*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 飞书失败告警（2026-09-18 复盘新增）：此前 node.js.yml 自身无任何通知，
    # 失败告警单点依赖 watcher 的 60s 轮询（watcher 挂了/被取消就静默）。
    # 此卡与 watcher 红卡冗余双保险，jq 形态按已验证的 elements-in-card 结构。
    - name: 飞书失败告警（研发部群）
      if: failure()
      env:
        WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      run: |
        set -euo pipefail
        TITLE="[${{ github.repository }}] n8n@${{ steps.ver.outputs.version }} 补丁包发版失败"
        M="❌ node.js.yml 补丁包流水线失败，Release 与 tag 未产出，需人工介入"$'\n'"日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        jq -n --arg t "$TITLE" --arg m "$M" \
          '{msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:"red"},
            elements:[{tag:"markdown",content:$m}]}}' > p_fail.json
        resp=$(curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @p_fail.json "$WEBHOOK")
        echo "feishu: $resp"

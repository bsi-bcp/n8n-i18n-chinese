# 构建完整 n8n 简体中文汉化包（editor-ui dist）并发版：
#   入口统一为 n8n-stable-watch.yml 评估通过后 dispatch（或人工 dispatch 并传 version）
#   产出=完整汉化 dist（Release 部署包 n8n-editor-ui@<版本>.tar.gz）→ dispatch image.yml 推 SWR 镜像
#   📌 产物命名规则（2026-09-19 定）：Release 部署包 = n8n-editor-ui@<版本号>.tar.gz，
#   中文镜像 = swr.cn-north-4.myhuaweicloud.com/bcphub/n8n-chinese:<版本号>
#   历史注记：2026-09-18 曾收窄为补丁包模式，同日按用户决策恢复完整包模式；
#   2.39.8 首日实战的三处缺陷均已修复并保留（见下各 🔒/🔴 标注）
name: package editor-ui languages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "n8n 版本号（如 2.39.8）；留空=自动取最新稳定 tag（不推荐）"
        type: string
        default: ""
      allow_prerelease:
        description: "显式允许上游 prerelease 发版（演练/补档，人工担责）"
        type: boolean
        default: false

# 🔴 2026-09-19 评审外置触发射频后必备：每小时外置触发 + 流水线 >1h（minor 大翻译量）时
#    可能双跑同版本——排队串行化，后启动者启动时 tag 已存在 → 自动干净退出
concurrency:
  group: nodejs-release
  cancel-in-progress: false

permissions:
  contents: write   # 翻译/dist 提交 + release tag + Release 附件
  actions: write    # workflow_dispatch 联动 image.yml（GITHUB_TOKEN 可触发的唯二事件之一）
  # ⚠️ 不可加 workflows:write——GITHUB_TOKEN 不支持该 scope，声明即整个文件非法
  #    （startup_failure，dispatch 连锁 403，2.39.8 实锤）。tag 推送的 workflow 提交
  #    竞态用「打 tag 前 rebase origin/main」策略规避。

jobs:
  build:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 60
    steps:
    - name: Resolve n8n version (input 优先，兜底稳定 tag)
      id: ver
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # 🔒 输入只经 env 进入 shell（防表达式内插注入），并强制裁剪为 semver 白名单
        if [ -n "$INPUT_VERSION" ]; then
          VERSION="$INPUT_VERSION"
        else
          VERSION=$(curl -s https://api.github.com/repos/n8n-io/n8n/releases?per_page=30 | jq -r '
            [ .[] | select(.draft == false and .prerelease == false)
                   | select(.tag_name | test("^n8n@[0-9]+[.][0-9]+[.][0-9]+$"))
                   | .tag_name | ltrimstr("n8n@") ]
            | sort_by(split(".") | map(tonumber)) | last // empty')
        fi
        VERSION="${VERSION#v}"
        if ! [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
          echo "::error::版本号未通过 semver 白名单校验: '$VERSION'"
          exit 1
        fi
        # 🔒 prerelease 守卫（2026-09-20 实锤加固）：上游 prerelease 一律拒绝发版——
        #    语义 = 本 workflow 只生产对外 Release，任何 dispatch 路径（人/bot/自动化）
        #    传 prerelease 版本都属越权发版（当日 2.40.3 曾被 dispatch 并污染 main 词典）。
        #    例外须显式传 allow_prerelease=true（演练/补档场景，人工担责）。
        UP_PRERELEASE=$(curl -s -m 20 -H "Authorization: Bearer ${{ github.token }}" \
          "https://api.github.com/repos/n8n-io/n8n/releases/tags/n8n@$VERSION" | jq -r '.prerelease // "absent"')
        if [ "$UP_PRERELEASE" = "true" ] && [ "${{ inputs.allow_prerelease }}" != "true" ]; then
          echo "::error::n8n@$VERSION 是上游 prerelease，拒绝发版（allow_prerelease=true 可显式覆盖）"
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "n8n tag: n8n@$VERSION / 本仓 tag: release/$VERSION"

    - name: Install pnpm
      run: npm install -g pnpm@10

    - name: Checkout local
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        path: ./n8n-i18n-chinese

    - name: Check if tag exists
      id: check_tag
      run: |
        TAG="release/${{ steps.ver.outputs.version }}"
        echo "Checking for remote tag: $TAG"
        if git ls-remote --tags origin | grep "refs/tags/$TAG$"; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese

    - name: Exit if tags exist
      if: steps.check_tag.outputs.exists == 'true'
      run: |
        echo "Tags exist, stopping workflow."

    # 📌 Checkout n8n 前置（2026-09-19 待办⑥落地）：en-nodes 提取与构建共用同一源码树，
    #    提取必须先于 Translate（translate.js merge en-nodes 须为本版最新）
    - name: Checkout n8n (git tag，勿用 target_commitish——release 分支会被上游清理)
      if: steps.check_tag.outputs.exists == 'false'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: n8n-io/n8n
        ref: n8n@${{ steps.ver.outputs.version }}
        path: ./n8n

    # 📌 en-nodes 自动提取（2026-09-19 待办⑥落地）：每版从 n8n 源码重提节点级 headers
    #    （面板第二层描述 + 第三层操作标题），替代本机手动 worktree 提取；
    #    产物含 _meta.version，watcher 按 minor 比对的机制不变
    - name: Extract en-nodes headers
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        npm install --prefix /tmp/ts-extract typescript@5 --silent
        NODE_PATH=/tmp/ts-extract/node_modules node script/extract-node-headers.js /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n | tail -12
        jq 'keys | length' script/en-nodes.json
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese

    - name: 记录翻译前键数（供发布说明计算翻译增量）
      if: steps.check_tag.outputs.exists == 'false'
      run: echo "PREV_KEY_COUNT=$(jq '[paths(scalars)] | length' languages/zh-CN.json)" >> "$GITHUB_ENV"
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese

    - name: Translate New Strings
      if: steps.check_tag.outputs.exists == 'false'
      # 🔒 评审 D-E4-5：script/ 独立 package.json + lockfile（npm ci 按锁定版本装三件套）
      #    ——不再向上解析根 package.json，拔掉 n8n-nodes-base@latest（isolated-vm 编译地雷）
      run: npm ci --no-audit --no-fund && N8N_EN_JSON_URL="https://raw.githubusercontent.com/n8n-io/n8n/n8n%40${{ steps.ver.outputs.version }}/packages/frontend/%40n8n/i18n/src/locales/en.json" node translate.js
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
        OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        OPENAI_API_CONCURRENT: ${{ vars.OPENAI_API_CONCURRENT }}
        OPENAI_BATCH_SIZE: ${{ vars.OPENAI_BATCH_SIZE }}

    # 词典覆盖率门禁（2026-09-18 复盘新增）：translate.js 对 LLM 失败条目只记日志跳过、
    # 进程仍退出 0——API 余额耗尽时缺译 dist 会带病发版且零告警。这里先补翻一轮
    # （zh 缺失键即补翻条件，瞬时故障自愈），仍超阈值则失败，由红卡兜底。
    - name: 词典覆盖率门禁（缺失>0 补翻一轮，补后 >1% 失败）
      if: steps.check_tag.outputs.exists == 'false'
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
        OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        OPENAI_API_CONCURRENT: ${{ vars.OPENAI_API_CONCURRENT }}
        OPENAI_BATCH_SIZE: ${{ vars.OPENAI_BATCH_SIZE }}
        UPSTREAM_EN: "https://raw.githubusercontent.com/n8n-io/n8n/n8n%40${{ steps.ver.outputs.version }}/packages/frontend/%40n8n/i18n/src/locales/en.json"
      run: |
        miss() {
          jq -n --slurpfile en en.json --slurpfile zh ../languages/zh-CN.json \
            '[($en[0]|paths(scalars)) as $p | select(($zh[0]|getpath($p)) == null)] | length'
        }
        total() {
          jq '[paths(scalars)] | length' en.json
        }
        MISS=$(miss); TOTAL=$(total)
        echo "zh 缺失 $MISS / 共 $TOTAL 键"
        if [ "$MISS" -gt 0 ]; then
          echo "::warning::首轮翻译缺失 $MISS 条（LLM 失败被静默跳过），补翻一轮…"
          N8N_EN_JSON_URL="$UPSTREAM_EN" node translate.js
          MISS=$(miss)
          echo "补翻后缺失：$MISS"
        fi
        if [ "$((MISS * 100))" -gt "$TOTAL" ]; then
          echo "::error::词典覆盖率不足 99%（缺失 $MISS/$TOTAL），疑似 LLM API 持续失败，阻断发版"
          exit 1
        fi

# D-E3-6：扫描先于词典 push（污染不得先入 main，阻断在此步之前生效）
    # 词典安全扫描（2026-09-19 评审 D-E3-5）：整本词典独立扫描——堵住人工补译/手改路径
    # 的注入/悬空引用盲区（translate.js 校验只覆盖机器翻译单条路径）；HIGH 命中阻断发版
    - name: 词典安全扫描
      if: steps.check_tag.outputs.exists == 'false'
      # 🔴 必须带三层 wd——仓库检出在 path: ./n8n-i18n-chinese 嵌套子目录，
      # 默认 workspace 少一层（2026-09-19 重跑 2.39.8 首跑实锤：该门禁自评审整改
      # 加入后从未真跑过，首次执行即因路径缺失失败）
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese
      run: node script/scan-zh-dict.js languages/zh-CN.json

    - name: Translate Publish Git
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git add languages/* script/en.json script/en-nodes.json || true

        # 如果没有变更就跳过
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "chore: auto translate for n8n@${{ steps.ver.outputs.version }}"
          git push origin
        fi
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      if: steps.check_tag.outputs.exists == 'false'
      with:
        node-version: 22.x

    - name: Set pnpm resolution mode
      if: steps.check_tag.outputs.exists == 'false'
      run: echo "resolution-mode=highest" >> /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n/.npmrc

    # ⚠️ 2026-09-19 六跑实锤：--ignore-scripts 会跳过 workspace 物化脚本（turbo 任务
    #    70→65，nodes-langchain 的 src/v2 类型产物缺失致 TS2345 构建失败）——首发成功
    #    配置即无此 flag，暂回滚；投毒面由 frozen-lockfile + 上游 tag 锚定兜底，后续以
    #    「精准放行清单」方式重新加固（勿直接复加此 flag）
    - run: pnpm install --frozen-lockfile
      if: steps.check_tag.outputs.exists == 'false'
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n

    - name: check n8n editor-ui is old
      id: editorui_dir
      run: |
        DIR_PATH="/home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n/packages/frontend/editor-ui"       # 新目录布局
        FALLBACK_DIR="/home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n/packages/editor-ui" # 旧目录布局（≤2.33）

        if [ -d "$DIR_PATH" ]; then
          echo "flag=new" >> $GITHUB_OUTPUT
          echo "dir=$DIR_PATH" >> $GITHUB_OUTPUT
        else
          echo "flag=old" >> $GITHUB_OUTPUT
          echo "dir=$FALLBACK_DIR" >> $GITHUB_OUTPUT
        fi

    - name: Move editor-ui i18n language
      if: steps.check_tag.outputs.exists == 'false'
      run:     cp -r /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/languages/* "/home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n/packages/frontend/@n8n/i18n/src/locales/"

    - name: Patch I18n zhCn
      if: steps.editorui_dir.outputs.flag == 'new' && steps.check_tag.outputs.exists == 'false'
      run: |
        git apply /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/patches/feat__i18n_zhCn.patch
        echo "==== /packages/frontend/@n8n/i18n/src/index.ts 内容 ===="
        head -n 30 /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n/packages/frontend/@n8n/i18n/src/index.ts
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n

    - name: Patch editor-ui zh enhancements（节点面板描述/操作标题汉化 + 源码控制弹窗硬编码标签）
      if: steps.editorui_dir.outputs.flag == 'new' && steps.check_tag.outputs.exists == 'false'
      run: |
        BASE=/home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/patches
        git apply "$BASE/feat__node_creator_actions_i18n.patch"
        # 2026-09-19 评审鲁棒化：dataTable/弹窗硬编码修复改语义脚本（git apply 上下文
        # 匹配被 2.40 defineFrontendModule 重构打爆——2.40.3 实测）；脚本对 2.39/2.40 双结构通吃
        # 🔴 参数必须是 .（working-directory 已是 n8n 根；传 ./n8n 会拼成 n8n/n8n 不存在——五跑实锤）
        node "$GITHUB_WORKSPACE/n8n-i18n-chinese/script/apply-hardcoded-labels.cjs" .
        echo "==== 补丁应用完成 ===="
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n

    - name: Pnpm build editor-ui
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        pnpm run build:n8n || echo "构建失败，重新检测是否成功"
        if [ -d "/home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n/packages/frontend/editor-ui/dist" ]; then
          echo "n8n-editor-ui:build 存在，构建成功"
        else
          echo "n8n-editor-ui:build 不存在，构建失败"
          exit 1
        fi
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n

    - name: 刷新第三方许可清单
      if: steps.check_tag.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # 📌 评审 E5-P2-A（2026-09-20）：THIRD_PARTY 刷新原为纯人工步骤 × 发版全自动 =
        # 结构性错位（2.40 起必然携带过期清单）。改为发版时自动拉上游对应 Release 附件；
        # 拉取失败不阻断发版（保留仓库现有副本），打印警告提示人工核对。
        REPO_DIR=/home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese
        VER="${{ steps.ver.outputs.version }}"
        ASSET_URL=$(gh api "repos/n8n-io/n8n/releases/tags/n8n@${VER}" --jq '.assets[] | select(.name=="THIRD_PARTY_LICENSES.md") | .url' 2>/dev/null || true)
        if [ -n "$ASSET_URL" ]; then
          if gh api "$ASSET_URL" -H "Accept: application/octet-stream" > "$REPO_DIR/THIRD_PARTY_LICENSES.md" 2>/dev/null; then
            echo "✅ THIRD_PARTY_LICENSES.md 已刷新自上游 n8n@${VER} Release 附件"
          else
            echo "⚠️ 上游附件下载失败，保留仓库现有副本（版本可能滞后，请人工核对）"
          fi
        else
          echo "⚠️ 上游 n8n@${VER} Release 无 THIRD_PARTY_LICENSES.md 附件，保留仓库现有副本（请人工核对）"
        fi

    - name: 打包 dist 产物
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        # 📌 SUL 积极义务（2026-09-19 评审 D-E5-1）：随附条款 + 显著修改声明随产物分发
        cp /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/NOTICE-n8n-localization.md dist/
        # 📌 第三方依赖许可清单（2026-09-19 起）：随包分发（清单覆盖 n8n 全体依赖，对
        #    editor-ui 前端子集属从宽声明；镜像侧为精确口径）
        cp /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/THIRD_PARTY_LICENSES.md dist/
        cp /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/LICENSE dist/LICENSE-MIT.md
        tar -czvf "n8n-editor-ui@${{ steps.ver.outputs.version }}.tar.gz" dist
      working-directory: ${{ steps.editorui_dir.outputs.dir }}

    - name: 拷贝 dist 到项目目录
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        # 🔴 目录已存在时 cp -r 会嵌套成 editor-ui-dist/dist（2.39.8 实锤：仓库内新旧两份
        #    dist 混放、镜像 COPY 错位）——先清空再拷，保证顶层布局恒为 dist 内容本身
        rm -rf /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/editor-ui-dist
        cp -r ${{ steps.editorui_dir.outputs.dir }}/dist /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/editor-ui-dist

    - name: Update docker-compose.yml version
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        VERSION="${{ steps.ver.outputs.version }}"
        echo "Replacing {version} with $VERSION in docker-compose.yml"
        sed -i "s/{version}/$VERSION/g" /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese/docker-compose.yml

    # 🔒 先提交 dist 再 rebase origin/main 后打 tag：构建窗口内 main 的 workflow 提交
    #    不得进入 tag 历史（GITHUB_TOKEN 无 workflows scope 可授，push 携带未入库的
    #    workflow 变更会被 GitHub 拒收——2.39.8 实锤）。rebase 后 tag 祖先 ⊆ 远端 main，
    #    唯一新提交（dist）不含 workflow 文件，推送必然被接受。
    - name: 创建 git tag
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        TAG="release/${{ steps.ver.outputs.version }}"
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add editor-ui-dist
        git add docker-compose.yml
        # 刷新后的第三方许可清单随同回写仓根（镜像构建 image.yml checkout main 天然取到）
        git add THIRD_PARTY_LICENSES.md
        git commit -m "chore: add built editor-ui dist for n8n@${{ steps.ver.outputs.version }}"
        git fetch origin main
        git rebase origin/main
        git tag $TAG
        git push origin main
        git push origin $TAG
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese

    - name: 创建 GitHub Release
      if: steps.check_tag.outputs.exists == 'false'
      id: create_release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        tag_name: release/${{ steps.ver.outputs.version }}
        name: n8n-editor-ui@${{ steps.ver.outputs.version }}（n8n 中文版部署包）
        body: |
          自动发布的中文语言包版本（对应 n8n@${{ steps.ver.outputs.version }}）。
        draft: false
        prerelease: false
        files: ${{ steps.editorui_dir.outputs.dir }}/n8n-editor-ui@${{ steps.ver.outputs.version }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 发布说明：上游 notes 中文总结（DeepSeek）+ 汉化变更 + 兼容区间；LLM 失败自动降级为原文
    - name: 生成发布说明
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        ZH_KEY_COUNT=$(jq '[paths(scalars)] | length' languages/zh-CN.json) \
          bash script/gen-release-notes.sh "${{ steps.ver.outputs.version }}" release-notes.md
        echo "---- release-notes.md ----"
        cat release-notes.md
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
        OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        PREV_KEY_COUNT: ${{ env.PREV_KEY_COUNT }}

    - name: 回写 Release 说明
      if: steps.check_tag.outputs.exists == 'false'
      run: gh release edit "release/${{ steps.ver.outputs.version }}" --notes-file release-notes.md
      working-directory: /home/runner/work/n8n-i18n-chinese/n8n-i18n-chinese/n8n-i18n-chinese
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 🔒 安全修复（2026-09-18 评审 #2）：不再依赖 PAT 创建 Release 来触发 image.yml 的
    #    release 事件——workflow_dispatch 是 GITHUB_TOKEN 唯二可触发的事件之一，
    #    由此以最小权限内置 token 联动镜像构建，全权限 classic PAT 退役。
    - name: 联动触发镜像构建
      if: steps.check_tag.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}  # 显式指定仓库：不依赖 cwd 的 git remote 解析
      run: |
        for i in 1 2 3; do
          gh workflow run image.yml --ref main -f version="${{ steps.ver.outputs.version }}" && { echo "已触发 image.yml"; exit 0; }
          sleep 10
        done
        echo "::error::触发 image.yml 失败（可手动 dispatch 兜底）"
        exit 1

    # 飞书失败告警（2026-09-18 复盘新增）：此前 node.js.yml 自身无任何通知，
    # 失败告警单点依赖 watcher 的 60s 轮询（watcher 挂了/被取消就静默）。
    # 此卡与 watcher 红卡冗余双保险，jq 形态按已验证的 elements-in-card 结构。
    - name: 飞书失败告警（研发部群）
      if: failure()
      env:
        WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      run: |
        set -euo pipefail
        TITLE="[${{ github.repository }}] n8n@${{ steps.ver.outputs.version }} 发版流水线失败"
        M="❌ node.js.yml 构建失败，Release 与镜像未产出，需人工介入"$'\n'"日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        jq -n --arg t "$TITLE" --arg m "$M" \
          '{msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:"red"},
            elements:[{tag:"markdown",content:$m}]}}' > p_fail.json
        resp=$(curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @p_fail.json "$WEBHOOK")
        echo "feishu: $resp"

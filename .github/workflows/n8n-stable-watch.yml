name: n8n Stable Watch

# n8n 发新稳定版 → 兼容性评估 → 报告/自动发版（阶段开关 AUTO_RELEASE）
# 评审修订（v2）：
#  D1 版本选择：枚举 releases + 正则 + prerelease 过滤，只跟插件当前大版本线
#  D2 引用：一律用 git tag n8n@X.Y.Z（不用 target_commitish，分支会被上游清理）
#  D3 翻译缺口：与 translate.js 同口径（新增/源变更/zh 缺失三类都要重翻）
#  D4 补丁检查：git apply --check 任一发版补丁硬失败即红灯；fuzz=3 判黄灯（黄灯仅报告不放行，D-E4-3）
#  D7 阶段开关：AUTO_RELEASE / report_only 显式控制

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      force_version:
        description: "强制评估该 n8n 版本号（如 2.40.1；仅接受 x.y.z 稳定格式，prerelease 演练走 node.js.yml 的 allow_prerelease）——与白名单校验口径一致（原描述「可为 beta」与实现矛盾，2026-09-21 评审 N6 对齐）"
        type: string
        default: ""
      report_only:
        description: "只评估报告，不自动发版（临时覆盖 AUTO_RELEASE）"
        type: boolean
        default: false

concurrency:
  group: n8n-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # 90min（2026-09-21 评审 P2-7 加重项）：60min 会在「评估段 5-10min + 子流水线 >50min」
    # 时连结果卡一起杀掉——第三态完全静默；与轮询预算 75min 匹配
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      AUTO_RELEASE: ${{ vars.AUTO_RELEASE || 'false' }}
      REPORT_ONLY: ${{ inputs.report_only }}
      FORCE: ${{ inputs.force_version }}
    steps:
      - name: Restore watch state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state
          key: n8n-watch-state-${{ github.run_id }}
          restore-keys: n8n-watch-state-

      - name: Resolve target n8n version (D1)
        id: ver
        run: |
          set -euo pipefail
          mkdir -p state
          [ -s state/watched.json ] || echo '{"watched":[]}' > state/watched.json
          if [ -n "${FORCE:-}" ]; then
            # 🔒 安全修复（2026-09-18 评审 #3）：drill 版本强制 semver 白名单，
            #    防止经 GITHUB_OUTPUT 二次内插回 shell 的注入链
            if ! [[ "$FORCE" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              echo "::error::force_version 未通过 semver 白名单校验: '$FORCE'"
              exit 1
            fi
            echo "version=$FORCE" >> "$GITHUB_OUTPUT"
            echo "drill=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sS -m 30 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/n8n-io/n8n/releases?per_page=40" -o rels.json
          # 本插件当前大版本线（取已有 release/x.y.z tag 的最大主版本，兜底 2）
          OUR_MAJOR=$(curl -sS -m 30 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/tags?per_page=100" \
            | grep -oE '"name": *"release/[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
          OUR_MAJOR=${OUR_MAJOR:-2}
          TARGET=$(jq -r --argjson mj "$OUR_MAJOR" '
            [ .[]
              | select(.draft == false and .prerelease == false)
              | select(.tag_name | test("^n8n@[0-9]+[.][0-9]+[.][0-9]+$"))
              | .tag_name | ltrimstr("n8n@") ]
            | map(select((split(".")[0] | tonumber) == $mj))
            | sort_by(split(".") | map(tonumber))
            | last // empty' rels.json)
          if [ -z "$TARGET" ]; then
            echo "::error::n8n 上未找到稳定版 release（过滤后为空）"
            exit 1
          fi
          echo "version=$TARGET" >> "$GITHUB_OUTPUT"
          echo "drill=false" >> "$GITHUB_OUTPUT"
          echo "探测到最新稳定版: n8n@$TARGET（跟随 ${OUR_MAJOR}.x 线）"

      - name: Skip if released or already evaluated
        id: gate
        run: |
          set -euo pipefail
          T="${{ steps.ver.outputs.version }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/release/$T")
          if [ "$code" = "200" ]; then
            # 完整性审计（2026-09-21 评审：幂等语义「tag 存在≠发版完成」——首跑在 tag 推送后
            # 中断会留下 tag 在/Release 无的残缺状态，当「已发版」跳过即假绿永久静默）
            REL=$(curl -s -o /dev/null -w '%{http_code}' -m 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/release/$T")
            if [ "$REL" = "200" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"; echo "reason=released" >> "$GITHUB_OUTPUT"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"; echo "reason=incomplete" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "${{ steps.ver.outputs.drill }}" != "true" ] \
            && jq -e --arg v "$T" '.watched | index($v)' state/watched.json >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "reason=evaluated" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Early exit (no action)
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "- 目标版本 n8n@${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.gate.outputs.reason }}" = "incomplete" ]; then
            echo "- 结果：🔴 残缺发版状态（tag 在而 Release/资产缺失），转人工处理" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 结果：本仓库已有对应 release（${{ steps.gate.outputs.reason }}），无需动作" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 残缺发版红灯（2026-09-21 评审 SRE#1/CI-N1 配套）：响亮告警转人工，不盲目重跑——
      # 重跑会被 node.js.yml 的完整性审计拒绝，唯一出路是人工补资产或删 tag
      - name: 残缺发版红灯（Issue 带外兜底）
        if: steps.gate.outputs.reason == 'incomplete' && steps.ver.outputs.drill != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          T: ${{ steps.ver.outputs.version }}
        run: |
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search "n8n@$T 发版残缺 in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "n8n@$T 发版残缺：tag 存在但 Release/资产缺失，需人工处理" \
              --body "首跑在 tag 推送后中断。处理：①补资产 \`gh release create release/$T --title n8n-editor-ui@$T\` + \`gh release upload release/$T <tarball> --clobber\`；或 ②删 tag 重跑（\`gh release delete\` + \`git push origin :refs/tags/release/$T\`）。评估运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "已存在残缺发版 Issue，跳过"
          fi

      - name: Checkout n8n source at tag (D2)
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: n8n-io/n8n
          ref: n8n@${{ steps.ver.outputs.version }}
          path: n8n
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout plugin (patches / language snapshots)
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plugin
          persist-credentials: false

      # SHA 锚定（2026-09-21 评审 P1-1）：评估所见的上游内容以 commit SHA 记录，
      # dispatch 传给 node.js.yml 按 SHA 检出——上游 force-push tag 不再造成
      # 「评估的内容」与「构建的内容」漂移
      - name: Record upstream anchor SHA
        if: steps.gate.outputs.skip == 'false'
        id: anchor
        working-directory: n8n
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Evaluate patches (D4 strict, fuzz fallback)
        if: steps.gate.outputs.skip == 'false'
        id: patch
        working-directory: n8n
        run: |
          VERDICT="green"; DETAILS=""
          # 🔴 门禁覆盖全部发版补丁（2026-09-19 评审 D-E4-1：任一硬失败即 red）；fuzz 黄灯仅报告不放行（D-E4-3）；*.old.patch 忽略
          for p in ../plugin/patches/*.patch; do
            [ -e "$p" ] || continue
            name=$(basename "$p")
            case "$name" in
              *.old.patch) DETAILS="$DETAILS- ⚪ $name（.old，忽略）"$'\n'; continue;;
              # fix_editor-ui.patch：CredentialConfig.vue 空值保护，上游 2.38.x 起已自修且文件
              # 迁至 features/ 布局——watcher 只跟最新稳定版，此补丁恒不适用（≤2.33 手动构建才用）
              fix_editor-ui.patch) DETAILS="$DETAILS- ⚪ $name（仅 ≤2.33 旧布局构建需要，忽略）"$'\n'; continue;;
              # 2026-09-19 鲁棒化：该补丁已废弃改语义脚本（2.40 defineFrontendModule 重构实锤
              # git apply 不可用）——可应用性由「Apply hardcoded labels (semantic)」步骤检查
              fix__hardcoded_labels.patch) DETAILS="$DETAILS- ⚪ $name（已由 apply-hardcoded-labels.cjs 语义脚本取代）"$'\n'; continue;;
            esac
            if git apply --check "$p" 2>/dev/null; then
              DETAILS="$DETAILS- ✅ $name 完整贴合"$'\n'
            elif patch -p1 --dry-run --fuzz=3 --silent < "$p" >/dev/null 2>&1; then
              [ "$VERDICT" = "green" ] && VERDICT="yellow"
              DETAILS="$DETAILS- 🟡 $name 需模糊贴合（fuzz≤3 可过）"$'\n'
            else
              # 🔴 2026-09-19 评审 D-E4-1：任一发版补丁硬失败即红灯——原口径只看
              #    feat__i18n_zhCn，其余补丁失效会绿灯放行 → node.js.yml 构建失败循环
              VERDICT="red"
              err=$(git apply --check "$p" 2>&1 | head -2 | tr '\n' ' ' | cut -c1-160)
              DETAILS="$DETAILS- ❌ $name 贴合失败：$err"$'\n'
            fi
          done
          {
            echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
            echo "details<<EOFDETAIL" >> "$GITHUB_OUTPUT"
            printf '%s' "$DETAILS" >> "$GITHUB_OUTPUT"
            echo "EOFDETAIL" >> "$GITHUB_OUTPUT"
          }

      - name: Apply hardcoded labels (semantic, D-E4-1 配套)
        if: steps.gate.outputs.skip == 'false'
        id: labels
        run: |
          # 语义脚本 --check 干跑：硬编码修复可应用性=门禁一部分（失败即红灯）
          node plugin/script/apply-hardcoded-labels.cjs ./n8n --check || {
            echo "verdict_override=red" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "verdict_override=green" >> "$GITHUB_OUTPUT"

      - name: Evaluate translation delta (D3, 同 translate.js 口径)
        if: steps.gate.outputs.skip == 'false'
        id: strings
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          # 🔒 contents API 直读 git 对象（2026-09-21 评审 P2-5）：raw.githubusercontent 的
          # Fastly gzip/br 变体缓存可能与 identity 内容不同步（排障实录 #2，translate.js
          # 已内建同一转换）——watcher 评估口径对齐，不再绕过该防护
          URL="https://api.github.com/repos/n8n-io/n8n/contents/packages/frontend/%40n8n/i18n/src/locales/en.json?ref=n8n%40$V"
          code=$(curl -sS -m 30 -o upstream_en.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" "$URL" || echo 000)
          if [ "$code" != "200" ]; then
            echo "new=NA" >> "$GITHUB_OUTPUT"; echo "changed=NA" >> "$GITHUB_OUTPUT"
            echo "todo=NA" >> "$GITHUB_OUTPUT"; echo "note=1" >> "$GITHUB_OUTPUT"
            echo "::warning::上游 en.json 拉取失败(HTTP $code)，i18n 结构可能又变了"
            exit 0
          fi
          jq -n \
            --slurpfile new upstream_en.json \
            --slurpfile old plugin/script/en.json \
            --slurpfile zh plugin/languages/zh-CN.json '
            def flat: . as $in | reduce (paths(scalars)) as $p ({}; .[($p|join("##"))] = ($in | getpath($p) | tostring));
            ($new[0] | flat) as $N | ($old[0] | flat) as $O | ($zh[0] | flat) as $Z |
            {
              new_keys:     ([ $N | to_entries[] | .key as $k | select(($O | has($k)) | not) ] | length),
              changed:      ([ $N | to_entries[] | . as $e | select((($O | has($e.key)) and (($O | .[$e.key]) != $e.value))) ] | length),
              missing_zh:   ([ $N | to_entries[] | .key as $k | select(($Z | has($k)) | not) ] | length),
              to_translate: ([ $N | to_entries[] | . as $e | select((($Z | has($e.key)) | not) or (($O | has($e.key)) | not) or (($O | .[$e.key]) != $e.value)) ] | length)
            }' > delta.json
          echo "new=$(jq -r .new_keys delta.json)" >> "$GITHUB_OUTPUT"
          echo "changed=$(jq -r .changed delta.json)" >> "$GITHUB_OUTPUT"
          echo "todo=$(jq -r .to_translate delta.json)" >> "$GITHUB_OUTPUT"
          echo "note=0" >> "$GITHUB_OUTPUT"
          cat delta.json

      - name: Check docker base image tags (n8n + runners 双镜像)
        if: steps.gate.outputs.skip == 'false'
        id: img
        run: |
          set -euo pipefail
          # 探测源 = image.yml 的实际构建源（ghcr；DockerHub 为上游另一双源之一，
          # 偶发不同步会导致评估卡与构建实际可用性错位——2026-09-19 对齐）
          # 🔴 双镜像探测（2026-09-21 评审两席共识）：image.yml 同版同批交付 chinese+runners，
          #    只探 n8n 会放行「runners 缺失/晚发」的半交付，违反同版配对红线
          GT=$(curl -s -m 20 "https://ghcr.io/token?scope=repository:n8n-io/n8n:pull&scope=repository:n8n-io/runners:pull" | jq -r .token)
          ALL=true
          for REPO in n8n-io/n8n n8n-io/runners; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 \
              -H "Authorization: Bearer $GT" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${REPO}/manifests/${{ steps.ver.outputs.version }}" || echo 000)
            echo "ghcr $REPO http: $code"
            [ "$code" = "200" ] || ALL=false
          done
          echo "exists=$ALL" >> "$GITHUB_OUTPUT"

      - name: Compose evaluation report
        if: steps.gate.outputs.skip == 'false'
        id: report
        env:
          LABELS_OVERRIDE: ${{ steps.labels.outputs.verdict_override }}
          PATCH_DETAILS: ${{ steps.patch.outputs.details }}
        run: |
          set -euo pipefail
          T="${{ steps.ver.outputs.version }}"
          DRILL="${{ steps.ver.outputs.drill }}"
          PV="${{ steps.patch.outputs.verdict }}"
          IMG="${{ steps.img.outputs.exists }}"
          case "$PV" in
            green) PVM="🟢 补丁完整贴合";;
            yellow) PVM="🟡 补丁需模糊贴合（可发版，建议人工复核补丁内容）";;
            red) PVM="🔴 补丁无法贴合（需人工适配，暂不可发版）";;
          esac
          if [ "${{ steps.strings.outputs.note }}" = "1" ]; then
            STR="⚠️ 上游 en.json 路径变化，翻译缺口无法统计"
          else
            STR="待翻译 **${{ steps.strings.outputs.todo }}** 条（新增 ${{ steps.strings.outputs.new }} / 源变更 ${{ steps.strings.outputs.changed }} / zh缺失 ${{ steps.strings.outputs.missing_zh }}）"
          fi
          if [ "$IMG" = "true" ]; then IMGM="✅ ghcr.io/n8n-io/{n8n,runners}:$T 双基础镜像已发布"
          else IMGM="⏳ ghcr.io 基础镜像未发布齐（n8n 或 runners，自动发版将等待下轮）"; fi
          TITLE="n8n@$T 兼容性评估"
          if [ "$DRILL" = "true" ]; then TITLE="【演练】$TITLE"; DRILLNOTE="（演练，不入状态）"; else DRILLNOTE=""; fi
          # 🔴 发版判定统一在 shell 字符串比较里算好输出单一标志——Auto release 步骤
          #    只认 steps.report.outputs.go_release。不再用 inputs.report_only != true
          #    这类表达式比较（gh CLI -f 传参存在字符串/布尔类型歧义，2026-09-19 隐患关闭）
          # 🟡 2026-09-19 评审 D-E4-3：仅绿灯（完整贴合）自动发版——fuzz 黄灯可静默错位，
          #    降级为「等待确认」，与卡片「建议人工复核」文案恢复一致
          GO=false
          if [ "$PV" = "green" ] && [ "${LABELS_OVERRIDE:-green}" != "red" ] && [ "$AUTO_RELEASE" = "true" ] && [ "${REPORT_ONLY:-false}" != "true" ] && [ "$IMG" = "true" ] && [ "$DRILL" != "true" ]; then
            GO=true
          fi
          echo "go_release=$GO" >> "$GITHUB_OUTPUT"
          {
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"
            {
              echo "md<<EOFMD"
              echo "- **目标版本**：n8n@$T $DRILLNOTE"
              echo "- **补丁贴合**：$PVM"
              # 🔒 经 env 传入（2026-09-21 评审 N5）：表达式内插进 shell 的反模式残留拔除；
              # %b→%s——%b 会解释反斜杠转义，git apply 报错文本可能被改写
              printf '%s' "$PATCH_DETAILS"
              echo "- **翻译缺口**：$STR"
              # 🟡 2026-09-19 评审 D-E4-2（短期项）：en-nodes 提取版本透明化——
              #    节点描述/操作标题提取在 CI 之外，新 minor 不重提取则面板覆盖不全
              ENNODES_VER=$(jq -r '._meta.version // "unknown"' plugin/script/en-nodes.json 2>/dev/null || echo unknown)
              if [ "$ENNODES_VER" != "$T" ]; then
                echo "- ⚠️ **en-nodes 提取版本**：$ENNODES_VER（目标 $T）——新 minor 的节点面板新文案需人工重提取（extract-node-headers.js），否则面板描述/操作标题覆盖不全"
              fi
              echo "- **基础镜像**：$IMGM"
              echo "- **自动发版**：AUTO_RELEASE=$AUTO_RELEASE report_only=${REPORT_ONLY:-false}"
              echo "> 🤖 来源：GitHub Actions · n8n Stable Watch · $GITHUB_EVENT_NAME · $(date -u '+%F %T') UTC · [运行 #$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
              if [ "$GO" = "true" ]; then
                echo "- **结论**：✅ 将自动发版（翻译 → 完整包构建 → Release → 镜像）"
              elif [ "$PV" = "red" ]; then
                echo "- **结论**：🛑 需人工适配补丁后重评"
              elif [ "$PV" = "yellow" ]; then
                echo "- **结论**：🟡 模糊贴合需人工复核补丁内容，确认后一键发版"
                echo "- 一键发版：\`gh workflow run node.js.yml -f version=$T -R $GITHUB_REPOSITORY\`"
              else
                echo "- **结论**：👁 具备发版条件，等待确认"
                echo "- 一键发版：\`gh workflow run node.js.yml -f version=$T -R $GITHUB_REPOSITORY\`"
              fi
              echo "EOFMD"
            } >> "$GITHUB_OUTPUT"
          }

      - name: Send evaluation card
        if: steps.gate.outputs.skip == 'false'
        env:
          REPORT_MD: ${{ steps.report.outputs.md }}
        run: |
          set -euo pipefail
          COLOR="blue"; [ "${{ steps.patch.outputs.verdict }}" = "yellow" ] && COLOR="orange"
          [ "${{ steps.patch.outputs.verdict }}" = "red" ] && COLOR="red"
          jq -n --arg t "${{ steps.report.outputs.title }}" --arg c "$COLOR" \
            --rawfile md <(printf '%s' "$REPORT_MD") '
            {msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:$c},
             elements:[{tag:"markdown",content:$md}]}}' > payload.json
          resp=$(curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @payload.json "$WEBHOOK")
          echo "feishu: $resp"
          echo "$resp" | grep -Eq '"(code|StatusCode|statusCode)"[ ]*:[ ]*0'

      - name: File issue if patch incompatible
        if: steps.gate.outputs.skip == 'false' && steps.patch.outputs.verdict == 'red' && steps.ver.outputs.drill != 'true'
        env:
          T: ${{ steps.ver.outputs.version }}
        run: |
          gh label create n8n-compat --color D93F0B -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          # 查重：watched 状态走 actions/cache（7 天不用会被逐出），逐出后同一红灯版本会重复评估；
          # 已有同版本 open Issue 则不再重复创建
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label n8n-compat \
            --search "n8n@$T 兼容性评估失败 in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTING" -gt 0 ]; then
            echo "已存在 open 的 n8n@$T 兼容性 Issue，跳过重复创建"
            exit 0
          fi
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "n8n@$T 兼容性评估失败：补丁需人工适配" \
            --label n8n-compat \
            --body "$(printf '%s' "${{ steps.report.outputs.md }}")

          评估运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          两步闭环——①适配后先重评：`gh workflow run n8n-stable-watch.yml -f force_version=$T -R $GITHUB_REPOSITORY`\n          ②重评绿灯后**必须手动发版**（重评不会自动发版也不解除状态机跳过）：`gh workflow run node.js.yml -f version=$T -R $GITHUB_REPOSITORY`"

      - name: Auto release (阶段 2)
        # 🔴 只信 report 步骤算好的 go_release 标志（shell 字符串比较产物），
        #    不在表达式层做 inputs 类型比较（2026-09-19 加固，见 report 步骤注释）
        if: >-
          steps.gate.outputs.skip == 'false' &&
          steps.report.outputs.go_release == 'true'
        id: rel
        run: |
          set -euo pipefail
          T="${{ steps.ver.outputs.version }}"
          # 🔴 连续失败退避（2026-09-21 评审 SRE#3）：同版本发版流水线连续失败 ≥3 次后
          #    停止自动 dispatch——失败时 Update watched 已把版本入态，gate 会跳过；
          #    此分支兜底覆盖「失败 <3 次仍在重试」窗口内的竞态
          FAILS=$(jq -r --arg v "$T" '.fails[$v] // 0' state/watched.json 2>/dev/null || echo 0)
          if [ "${FAILS:-0}" -ge 3 ]; then
            echo "连续失败 $FAILS 次，停止自动 dispatch（转 Issue 跟踪）"
            echo "conclusion=backoff-stop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # SHA 锚定：把评估所见的上游 commit 传给构建端（防 tag force-push 内容漂移）
          if ! gh workflow run node.js.yml -R "$GITHUB_REPOSITORY" -f version="$T" -f commit_sha="${{ steps.anchor.outputs.sha }}"; then
            # dispatch 失败（如权限缺失）必须让下个整点重试，且红卡要发得出来
            echo "conclusion=dispatch-failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "已触发发版流水线，跟踪中…"
          CONCL=""; RUNID=""
          # 轮询 75 次=75min（2026-09-21 评审 P2-7：minor 大翻译量流水线可 >1h，
          # 原 45min 上限必然超时误报；job timeout 90min 同步放宽）
          for i in $(seq 1 75); do
            sleep 60
            R=$(gh run list -R "$GITHUB_REPOSITORY" --workflow=node.js.yml \
              --event=workflow_dispatch --created ">$START" --limit 1 \
              --json databaseId,status,conclusion 2>/dev/null || echo '[]')
            ST=$(echo "$R" | jq -r '.[0].status // ""')
            CONCL=$(echo "$R" | jq -r '.[0].conclusion // ""')
            RUNID=$(echo "$R" | jq -r '.[0].databaseId // ""')
            echo "poll#$i status=$ST conclusion=$CONCL"
            [ "$ST" = "completed" ] && break
          done
          echo "conclusion=${CONCL:-timeout}" >> "$GITHUB_OUTPUT"
          echo "runid=$RUNID" >> "$GITHUB_OUTPUT"

      - name: Send release result card (阶段 2)
        if: always() && steps.rel.outputs.conclusion != ''
        run: |
          set -euo pipefail
          T="${{ steps.ver.outputs.version }}"
          C="${{ steps.rel.outputs.conclusion }}"
          RUNURL=""
          [ -n "${{ steps.rel.outputs.runid }}" ] && RUNURL="日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.rel.outputs.runid }}"
          # timeout≠失败（2026-09-21 评审 P2-7）：watcher 跟踪超时时流水线多半仍在正常跑，
          # 发红卡=误报「需人工介入」——改蓝卡转述事实，结局由 node.js.yml 失败卡兜底
          if [ "$C" = "success" ]; then COLOR="green"; M="✅ 发版成功：Release 与 tag 已创建（镜像构建由 image.yml 接力）"
          elif [ "$C" = "timeout" ]; then COLOR="blue"; M="⏳ watcher 跟踪超时（75min），流水线大概率仍在运行——结果以 node.js.yml 与 image.yml 的后续卡为准"$'\n'"$RUNURL"
          elif [ "$C" = "backoff-stop" ]; then COLOR="orange"; M="⛔ 连续失败达退避阈值，本轮未 dispatch——已建 Issue 跟踪，人工处理后可 force_version 重评或直接 dispatch node.js.yml"
          else COLOR="red"; M="❌ 发版流水线结果：$C，需人工介入"$'\n'"$RUNURL"; fi
          SRC="> 🤖 来源：GitHub Actions · n8n Stable Watch · $GITHUB_EVENT_NAME · $(date -u '+%F %T') UTC · [运行 #$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          jq -n --arg t "[${{ github.repository }}] n8n@$T 自动发版" --arg c "$COLOR" \
             --arg m "$M"$'\n'"$SRC" \
            '{msg_type:"interactive",card:{header:{title:{tag:"plain_text",content:$t},template:$c},
              elements:[{tag:"markdown",content:$m}]}}' > p2.json
          resp=$(curl -sS -m 15 -H 'Content-Type: application/json' --data-binary @p2.json "$WEBHOOK")
          echo "feishu: $resp"
          echo "$resp" | grep -Eq '"(code|StatusCode|statusCode)"[ ]*:[ ]*0'

      - name: Update watched state
        # 仅当发版链真正成功（rel 未执行＝红光/AUTO 关闭；或 rel 成功收尾）才入状态；
        # dispatch 失败不入状态 → 下个整点自动重试；
        # 流水线失败 1-2 次仅计数不终态（保留下个整点自动重试，LLM 瞬时故障自愈），
        # 连续 ≥3 次入状态停止重试并转 Issue（2026-09-21 评审 SRE#3 退避，消灭小时级轰炸）；
        # 绿灯但基础镜像未发布也不入状态——兑现评估卡「自动发版将等待下轮」的承诺
        if: >-
          steps.gate.outputs.skip == 'false' &&
          steps.ver.outputs.drill != 'true' &&
          (steps.rel.outcome != 'success' || steps.rel.outputs.conclusion == 'success' || steps.rel.outputs.conclusion == 'failure' || steps.rel.outputs.conclusion == 'cancelled') &&
          !(env.AUTO_RELEASE == 'true' && steps.patch.outputs.verdict != 'red' && steps.img.outputs.exists == 'false')
        run: |
          set -euo pipefail
          T="${{ steps.ver.outputs.version }}"
          C="${{ steps.rel.outputs.conclusion }}"
          SHA="${{ steps.anchor.outputs.sha }}"
          CUR=$(jq -r --arg v "$T" '.fails[$v] // 0' state/watched.json)
          NEWF=0; ADD=true
          if [ "$C" = "failure" ] || [ "$C" = "cancelled" ]; then
            NEWF=$((CUR + 1))
            if [ "$NEWF" -lt 3 ]; then ADD=false; fi
          fi
          jq -n --slurpfile s state/watched.json --arg v "$T" --argjson f "$NEWF" --arg sha "$SHA" --argjson add "$ADD" \
            '{watched: (if $add then ((($s[0].watched // []) + [$v]) | unique | .[-200:]) else ($s[0].watched // []) end),
              fails: ((($s[0].fails // {}) | .[$v] = $f) | with_entries(select(.value > 0))),
              shas: ((($s[0].shas // {}) | .[$v] = $sha))}' > state/watched.json.new
          mv state/watched.json.new state/watched.json
          cat state/watched.json
          echo "- 已评估版本入状态：$T（fails=$NEWF, anchored=$SHA）" >> "$GITHUB_STEP_SUMMARY"

      # 退避终态 Issue：连续第 3 次失败时版本刚入 watched（不再自动重试），Issue 是
      # 持久人工待办——GitHub 邮件通知为带外通道，飞书 webhook 失效时仍可达（P1-2）
      - name: 连续失败转 Issue
        if: >-
          steps.gate.outputs.skip == 'false' && steps.ver.outputs.drill != 'true' &&
          (steps.rel.outputs.conclusion == 'failure' || steps.rel.outputs.conclusion == 'cancelled')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          T: ${{ steps.ver.outputs.version }}
        run: |
          FAILS=$(jq -r --arg v "$T" '.fails[$v] // 0' state/watched.json)
          [ "$FAILS" -ge 3 ] || { echo "失败 $FAILS 次（<3），继续自动重试"; exit 0; }
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search "n8n@$T 发版流水线连续失败 in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "n8n@$T 发版流水线连续失败 3 次，已停止自动重试" \
              --label n8n-compat \
              --body "发版流水线连续失败（详见各轮红卡与 node.js.yml 日志）。人工修复后闭环：\`gh workflow run n8n-stable-watch.yml -f force_version=$T -R $GITHUB_REPOSITORY\` 重评，或直接 \`gh workflow run node.js.yml -f version=$T -R $GITHUB_REPOSITORY\`。最近一次运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "已存在连续失败 Issue，跳过"
          fi

      # 待确认版本持久待办（2026-09-21 评审 P1-4）：AUTO 关闭的绿灯 / 黄灯 / 演练报告
      # 只发一次评估卡，watched 状态让后续小时全部跳过——卡漏看即静默搁浅。
      # Issue（GitHub 邮件）作为持久提醒，人工发版后关闭；AUTO 开且镜像未就绪的自愈
      # 场景不建 Issue（下小时自动重评）
      - name: 待确认版本建跟踪 Issue
        if: >-
          steps.gate.outputs.skip == 'false' && steps.ver.outputs.drill != 'true' &&
          steps.report.outputs.go_release != 'true' && steps.patch.outputs.verdict != 'red'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          T: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          PV="${{ steps.patch.outputs.verdict }}"
          if [ "${AUTO_RELEASE:-false}" = "true" ] && [ "$PV" != "yellow" ]; then
            echo "AUTO_RELEASE 开且非黄灯（等待镜像就绪，下小时自愈），不建 Issue"
            exit 0
          fi
          gh label create n8n-release-pending --color 0E8A16 -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search "n8n@$T 具备发版条件 in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTING" -gt 0 ]; then echo "已存在待确认 Issue，跳过"; exit 0; fi
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "n8n@$T 具备发版条件，等待确认" \
            --label n8n-release-pending \
            --body "评估结论：$PV（AUTO_RELEASE=${AUTO_RELEASE:-false}）。确认后一键发版：\`gh workflow run node.js.yml -f version=$T -R $GITHUB_REPOSITORY\`（发版后关闭本 Issue）。评估运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # watcher 自身失败自救（2026-09-21 评审 P1-2）：此前 watcher 挂掉零信号——
      # 全部告警走飞书 webhook，webhook 失效时连「告警失效」这件事都无人知道。
      # Issue 走 GitHub 邮件，是 webhook 之外的带外通道
      - name: Watcher 自身失败自救（Issue 带外）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search "n8n-stable-watch 运行失败 in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "n8n-stable-watch 运行失败（run #$GITHUB_RUN_ID）" \
              --body "watcher 运行失败——可能是评估步骤异常或飞书 webhook 失效（若卡片通道断了，此 Issue 是唯一信号）。人工排查后关闭。日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "已存在 watcher 失败 Issue（open），跳过重复创建"
          fi

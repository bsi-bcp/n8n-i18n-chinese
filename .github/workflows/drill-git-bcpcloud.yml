# 一次性演练：验证「GitHub Actions → TX-43」这条链路能否支撑 git.bcpcloud.cn 方案
# 目的：方案唯一的生死依赖是「GitHub 侧能否稳定推入 TX-43」——只实测能回答，推理不算数
# 用完即拆：删除本 workflow + DRILL_SSH_KEY secret + TX-43 上的演练仓与密钥
name: drill-git-bcpcloud

on:
  workflow_dispatch:

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: Runner 出口 IP（记录是哪台 runner）
        run: |
          echo -n "runner egress IP: "; curl -s -m 15 https://api.ipify.org; echo

      - name: ① TX-43 可达性与时延（×10 次采样）
        run: |
          ok=0; fail=0
          for i in $(seq 1 10); do
            printf "  #%02d " "$i"
            if curl -s -o /dev/null -m 20 -w "HTTPS %{http_code}  connect=%{time_connect}s  total=%{time_total}s\n" https://registry.bcpcloud.cn/v2/; then
              ok=$((ok+1))
            else
              echo "❌ 失败"; fail=$((fail+1))
            fi
            sleep 2
          done
          echo "→ 成功 $ok / 失败 $fail"

      - name: ② TX-43 TCP 端口探测（22 / 443）
        run: |
          for p in 22 443; do
            printf "  43.139.228.145:%s " "$p"
            if timeout 8 bash -c "</dev/tcp/43.139.228.145/$p" 2>/dev/null; then echo "✅ 可建连"; else echo "❌ 不可达"; fi
          done

      - name: ③ 真实 git push 到 TX-43（演练仓，3 次重试）
        env:
          KEY: ${{ secrets.DRILL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          mkdir -p /tmp/drill && cd /tmp/drill
          git init -q -b main
          git config user.email drill@bsi.local && git config user.name drill
          echo "drill run $(date -u +%FT%TZ) from $(curl -s -m 10 https://api.ipify.org)" > README.md
          git add -A && git commit -qm "drill commit"
          ssh-keyscan 43.139.228.145 >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          for i in 1 2 3; do
            t0=$(date +%s)
            if git push -q ssh://gitmirror@43.139.228.145/srv/git/repos/drill.git main 2>&1; then
              echo "✅ push 成功（第 $i 次，耗时 $(( $(date +%s) - t0 ))s）"; exit 0
            fi
            echo "❌ push 第 $i 次失败（耗时 $(( $(date +%s) - t0 ))s）"
            sleep 5
          done
          echo "::error::三次 push 均失败——GitHub→TX-43 链路不可用"
          exit 1
